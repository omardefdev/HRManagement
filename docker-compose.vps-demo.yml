# PLAN-36 (D-36-1): "demo mode" for the single host, the mode the acceptance stack proved. Synthetic data only.
# deploy/vps/remote-deploy.sh adds this file only when HRM_DEPLOYMENT_MODE=demo in the server's .env.
# - PLAN-38 (D-38-1): the database stays in "demo posture": the applications connect with the PostgreSQL administrator
#   until wave 2 (OPS-D) closes the effects of enforced row-level security. The schema is no longer created by the
#   applications: hrm-bootstrap migrates every database as <svc>_migrator before any application starts, so every table
#   is owned by its migrator and moving to the *_app roles later needs no ownership change.
# - Seed:Profile=Demo loads the synthetic demo data; the production configuration guard refuses demo mode with
#   Seed:Profile=None (contradiction), and Deployment:Banner=demo shows "بيئة عرض — بيانات اصطناعية فقط" in the
#   gateway and module headers.
# Row-level security and the least-privilege roles that would make this fit for real data: PLAN-38 and wave 2 (OPS-D).

x-demo-env: &demo-env
  Deployment__Mode: demo
  Deployment__Banner: demo
  Seed__Profile: Demo
  RabbitMQ__Username: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER required}
  RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS required}

services:
  hr-gateway:
    environment:
      <<: *demo-env
      ConnectionStrings__GatewayAuditDb: Host=postgresql;Port=5432;Database=gateway_audit_db;Username=${POSTGRES_USER:?POSTGRES_USER required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}

  hr-core-web:
    environment:
      <<: *demo-env
