global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/recording-rules.yml
  - /etc/prometheus/slo-burn-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: hr-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["hr-gateway:8080"]

  - job_name: hr-core
    metrics_path: /metrics
    static_configs:
      - targets: ["hr-core-web:8080"]

  - job_name: hr-contracts
    metrics_path: /metrics
    static_configs:
      - targets: ["hr-contracts-web:8080"]

  - job_name: hr-health
    metrics_path: /metrics
    static_configs:
      - targets: ["hr-health-web:8080"]

  - job_name: hr-movements
    metrics_path: /metrics
    static_configs:
      - targets: ["hr-movements-web:8080"]

  - job_name: hr-training
    metrics_path: /metrics
    static_configs:
      - targets: ["hr-training-web:8080"]

  - job_name: payroll
    metrics_path: /metrics
    static_configs:
      - targets: ["payroll-web:8080"]

  - job_name: idcard
    metrics_path: /metrics
    static_configs:
      - targets: ["idcard-web:8080"]

  - job_name: records-archive
    metrics_path: /metrics
    static_configs:
      - targets: ["records-archive-web:8080"]

  - job_name: admin-logistics
    metrics_path: /metrics
    static_configs:
      - targets: ["admin-logistics-web:8080"]

  - job_name: it-infra
    metrics_path: /metrics
    static_configs:
      - targets: ["it-infra-web:8080"]

  - job_name: dev-analytics
    metrics_path: /metrics
    static_configs:
      - targets: ["dev-analytics-web:8080"]

  - job_name: compliance
    metrics_path: /metrics
    static_configs:
      - targets: ["compliance-web:8080"]

  - job_name: auth-directory
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-directory-web:8080"]

  - job_name: file-storage
    metrics_path: /metrics
    static_configs:
      - targets: ["file-storage-web:8080"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq-exporter:9419"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: probe_gateway_ready
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://hr-gateway:8080/health/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: probe_gateway_live
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://hr-gateway:8080/health/live
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
