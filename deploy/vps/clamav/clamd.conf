# PLAN-36 (§3): clamd configuration for the single host, mounted over /etc/clamav/clamd.conf of clamav/clamav:1.4.
# The settings below are the image's own effective defaults (extracted from the pinned image) plus one change:
# ConcurrentDatabaseReload no. With the default (yes) clamd loads the new signature database next to the old one on
# every freshclam update, which briefly doubles its memory (about 1 GiB more) and can hit the 2 GiB limit.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
ConcurrentDatabaseReload no
