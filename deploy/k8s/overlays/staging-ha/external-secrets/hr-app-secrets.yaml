# OPS-005: ExternalSecret replaces base secret-placeholder for production.
# Remote paths under AWS Secrets Manager — IAM-004 least-privilege service roles.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hr-app-secrets
  labels:
    app.kubernetes.io/part-of: hrmanagement
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: hr-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: /hrmanagement/staging/postgres/app
        property: password
    - secretKey: RABBITMQ_DEFAULT_PASS
      remoteRef:
        key: /hrmanagement/staging/rabbitmq/default
        property: password
    - secretKey: KEYCLOAK_HR_GATEWAY_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/staging/keycloak/gateway-client
        property: secret
    - secretKey: SVC_HR_CORE_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/staging/keycloak/svc-hr-core
        property: secret
    - secretKey: SVC_HR_CONTRACTS_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/staging/keycloak/svc-hr-contracts
        property: secret
    - secretKey: SVC_HR_MOVEMENTS_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/staging/keycloak/svc-hr-movements
        property: secret
    - secretKey: SVC_PAYROLL_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/staging/keycloak/svc-payroll
        property: secret
    - secretKey: SVC_IDCARD_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/staging/keycloak/svc-idcard
        property: secret
    - secretKey: SVC_RECORDS_ARCHIVE_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/staging/keycloak/svc-records-archive
        property: secret
    - secretKey: SVC_ADMIN_LOGISTICS_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/staging/keycloak/svc-admin-logistics
        property: secret
    - secretKey: SVC_IT_INFRA_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/staging/keycloak/svc-it-infra
        property: secret
    - secretKey: SVC_COMPLIANCE_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/staging/keycloak/svc-compliance
        property: secret
    - secretKey: SVC_AUTH_DIRECTORY_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/staging/keycloak/svc-auth-directory
        property: secret
    - secretKey: SVC_HR_HEALTH_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/staging/keycloak/svc-hr-health
        property: secret
    - secretKey: SVC_HR_TRAINING_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/staging/keycloak/svc-hr-training
        property: secret
    - secretKey: SVC_DEV_ANALYTICS_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/staging/keycloak/svc-dev-analytics
        property: secret
