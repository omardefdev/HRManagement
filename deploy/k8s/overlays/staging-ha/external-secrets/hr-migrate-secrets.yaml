# PLAN-42: the migration Job is the one reader of every connection string; no application container holds this secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hr-migrate-secrets
  labels:
    app.kubernetes.io/part-of: hrmanagement
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: hr-migrate-secrets
    creationPolicy: Owner
  data:
    - secretKey: ConnectionStrings__GatewayAuditDb
      remoteRef:
        key: /hrmanagement/staging/postgres/gateway-audit
        property: connectionString
    - secretKey: ConnectionStrings__HRCoreDb
      remoteRef:
        key: /hrmanagement/staging/postgres/hr-core
        property: connectionString
    - secretKey: ConnectionStrings__ContractsDb
      remoteRef:
        key: /hrmanagement/staging/postgres/hr-contracts
        property: connectionString
    - secretKey: ConnectionStrings__HealthDb
      remoteRef:
        key: /hrmanagement/staging/postgres/hr-health
        property: connectionString
    - secretKey: ConnectionStrings__MovementsDb
      remoteRef:
        key: /hrmanagement/staging/postgres/hr-movements
        property: connectionString
    - secretKey: ConnectionStrings__TrainingDb
      remoteRef:
        key: /hrmanagement/staging/postgres/hr-training
        property: connectionString
    - secretKey: ConnectionStrings__PayrollDb
      remoteRef:
        key: /hrmanagement/staging/postgres/payroll
        property: connectionString
    - secretKey: ConnectionStrings__IDCardDb
      remoteRef:
        key: /hrmanagement/staging/postgres/idcard
        property: connectionString
    - secretKey: ConnectionStrings__ArchiveDb
      remoteRef:
        key: /hrmanagement/staging/postgres/archive
        property: connectionString
    - secretKey: ConnectionStrings__AdminDb
      remoteRef:
        key: /hrmanagement/staging/postgres/admin
        property: connectionString
    - secretKey: ConnectionStrings__ITInfraDb
      remoteRef:
        key: /hrmanagement/staging/postgres/it-infra
        property: connectionString
    - secretKey: ConnectionStrings__AnalyticsDb
      remoteRef:
        key: /hrmanagement/staging/postgres/analytics
        property: connectionString
    - secretKey: ConnectionStrings__ComplianceDb
      remoteRef:
        key: /hrmanagement/staging/postgres/compliance
        property: connectionString
    - secretKey: ConnectionStrings__AuthDirectoryDb
      remoteRef:
        key: /hrmanagement/staging/postgres/auth-directory
        property: connectionString
    - secretKey: ConnectionStrings__FileStorageDb
      remoteRef:
        key: /hrmanagement/staging/postgres/file-storage
        property: connectionString
