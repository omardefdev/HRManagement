# PLAN-42 (G-IAM-13): this service's secrets and nothing else. docs/S2S_SECRET_MATRIX.md lists why each key is here.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hr-gateway-secrets
  labels:
    app.kubernetes.io/part-of: hrmanagement
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: hr-gateway-secrets
    creationPolicy: Owner
  data:
    - secretKey: ConnectionStrings__GatewayAuditDb
      remoteRef:
        key: /hrmanagement/staging/postgres/gateway-audit
        property: connectionString
    - secretKey: Keycloak__ClientSecret
      remoteRef:
        key: /hrmanagement/staging/keycloak/gateway-client
        property: secret
    - secretKey: GatewayCallerProof__PrivateKeyPem
      remoteRef:
        key: /hrmanagement/staging/gateway/proof
        property: privateKey
