# PLAN-42 (G-IAM-13): this service's secrets and nothing else. docs/S2S_SECRET_MATRIX.md lists why each key is here.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: idcard-web-secrets
  labels:
    app.kubernetes.io/part-of: hrmanagement
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: idcard-web-secrets
    creationPolicy: Owner
  data:
    - secretKey: ConnectionStrings__IDCardDb
      remoteRef:
        key: /hrmanagement/staging/postgres/idcard
        property: connectionString
    - secretKey: GatewayCallerProof__PublicKeyPem
      remoteRef:
        key: /hrmanagement/staging/gateway/proof
        property: publicKey
    - secretKey: RabbitMQ__Username
      remoteRef:
        key: /hrmanagement/staging/rabbitmq/idcard
        property: username
    - secretKey: RabbitMQ__Password
      remoteRef:
        key: /hrmanagement/staging/rabbitmq/idcard
        property: password
    - secretKey: SVC_IDCARD_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/staging/keycloak/svc-idcard
        property: secret
