apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hrmanagement
resources:
  - ../../base
  - hpa.yaml
  - pdb.yaml
  - ingress.yaml
  - external-secrets
patches:
  - path: patches/replicas.yaml
  - path: external-secrets/delete-placeholder.yaml
    target:
      kind: Secret
      labelSelector: hrmanagement.io/secret-source=dev-only-placeholder
