apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hr-gateway
  labels:
    app.kubernetes.io/name: hr-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hr-gateway
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
