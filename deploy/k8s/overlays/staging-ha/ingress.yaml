apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hr-gateway
  labels:
    app.kubernetes.io/name: hr-gateway
  annotations:
    # REL-001: lab TLS (self-signed / tls-stub secret). Prod uses letsencrypt-prod.
    cert-manager.io/cluster-issuer: selfsigned-staging
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hr.staging.example.com
      secretName: hr-gateway-tls
  rules:
    - host: hr.staging.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hr-gateway
                port:
                  number: 8080
