apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hr-gateway
  labels:
    app.kubernetes.io/name: hr-gateway
    ops.hrmanagement.io/site: secondary
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hr-dr.example.com
      secretName: hr-gateway-tls-dr
  rules:
    - host: hr-dr.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hr-gateway
                port:
                  number: 8080
