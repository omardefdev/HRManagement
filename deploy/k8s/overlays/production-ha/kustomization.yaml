apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hrmanagement
resources:
  - ../../base
  - hpa.yaml
  - pdb.yaml
  - ingress.yaml
  - external-secrets/hr-app-secrets.yaml
patches:
  - path: patches/replicas.yaml
  - path: external-secrets/delete-placeholder.yaml
# Before apply: replace OWNER and IMAGE_TAG (same SHA promoted by DEP-001).
