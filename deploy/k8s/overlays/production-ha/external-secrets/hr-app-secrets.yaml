# OPS-005: ExternalSecret replaces base secret-placeholder for production.
# Remote paths under AWS Secrets Manager — IAM-004 least-privilege service roles.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hr-app-secrets
  labels:
    app.kubernetes.io/part-of: hrmanagement
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: hr-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: /hrmanagement/production/postgres/app
        property: password
    - secretKey: RABBITMQ_DEFAULT_PASS
      remoteRef:
        key: /hrmanagement/production/rabbitmq/default
        property: password
    - secretKey: KEYCLOAK_HR_GATEWAY_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/production/keycloak/gateway-client
        property: secret
    - secretKey: Keycloak__ClientSecret
      remoteRef:
        key: /hrmanagement/production/keycloak/gateway-client
        property: secret
    - secretKey: GatewayCallerProof__Secret
      remoteRef:
        key: /hrmanagement/production/gateway/caller-proof
        property: secret
    - secretKey: ConnectionStrings__GatewayAuditDb
      remoteRef:
        key: /hrmanagement/production/postgres/gateway-audit
        property: connectionString
    - secretKey: ConnectionStrings__HRCoreDb
      remoteRef:
        key: /hrmanagement/production/postgres/hr-core
        property: connectionString
    - secretKey: ConnectionStrings__ContractsDb
      remoteRef:
        key: /hrmanagement/production/postgres/hr-contracts
        property: connectionString
    - secretKey: ConnectionStrings__PayrollDb
      remoteRef:
        key: /hrmanagement/production/postgres/payroll
        property: connectionString
    - secretKey: ConnectionStrings__HealthDb
      remoteRef:
        key: /hrmanagement/production/postgres/hr-health
        property: connectionString
    - secretKey: ConnectionStrings__MovementsDb
      remoteRef:
        key: /hrmanagement/production/postgres/hr-movements
        property: connectionString
    - secretKey: ConnectionStrings__TrainingDb
      remoteRef:
        key: /hrmanagement/production/postgres/hr-training
        property: connectionString
    - secretKey: ConnectionStrings__IDCardDb
      remoteRef:
        key: /hrmanagement/production/postgres/idcard
        property: connectionString
    - secretKey: ConnectionStrings__ArchiveDb
      remoteRef:
        key: /hrmanagement/production/postgres/archive
        property: connectionString
    - secretKey: ConnectionStrings__AdminDb
      remoteRef:
        key: /hrmanagement/production/postgres/admin
        property: connectionString
    - secretKey: ConnectionStrings__ITInfraDb
      remoteRef:
        key: /hrmanagement/production/postgres/it-infra
        property: connectionString
    - secretKey: ConnectionStrings__AnalyticsDb
      remoteRef:
        key: /hrmanagement/production/postgres/analytics
        property: connectionString
    - secretKey: ConnectionStrings__ComplianceDb
      remoteRef:
        key: /hrmanagement/production/postgres/compliance
        property: connectionString
    - secretKey: ConnectionStrings__AuthDirectoryDb
      remoteRef:
        key: /hrmanagement/production/postgres/auth-directory
        property: connectionString
    - secretKey: ConnectionStrings__FileStorageDb
      remoteRef:
        key: /hrmanagement/production/postgres/file-storage
        property: connectionString
    - secretKey: FileStorage__AccessKey
      remoteRef:
        key: /hrmanagement/production/minio/filestorage
        property: accessKey
    - secretKey: FileStorage__SecretKey
      remoteRef:
        key: /hrmanagement/production/minio/filestorage
        property: secretKey
    - secretKey: KEYCLOAK_DIRECTORY_SYNC_SECRET
      remoteRef:
        key: /hrmanagement/production/keycloak/directory-sync
        property: secret
    - secretKey: Keycloak__DirectorySync__AdminClientSecret
      remoteRef:
        key: /hrmanagement/production/keycloak/directory-sync
        property: secret
    - secretKey: SVC_HR_CORE_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/production/keycloak/svc-hr-core
        property: secret
    - secretKey: SVC_HR_CONTRACTS_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/production/keycloak/svc-hr-contracts
        property: secret
    - secretKey: SVC_HR_HEALTH_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/production/keycloak/svc-hr-health
        property: secret
    - secretKey: SVC_HR_MOVEMENTS_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/production/keycloak/svc-hr-movements
        property: secret
    - secretKey: SVC_HR_TRAINING_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/production/keycloak/svc-hr-training
        property: secret
    - secretKey: SVC_PAYROLL_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/production/keycloak/svc-payroll
        property: secret
    - secretKey: SVC_IDCARD_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/production/keycloak/svc-idcard
        property: secret
    - secretKey: SVC_RECORDS_ARCHIVE_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/production/keycloak/svc-records-archive
        property: secret
    - secretKey: SVC_ADMIN_LOGISTICS_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/production/keycloak/svc-admin-logistics
        property: secret
    - secretKey: SVC_IT_INFRA_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/production/keycloak/svc-it-infra
        property: secret
    - secretKey: SVC_DEV_ANALYTICS_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/production/keycloak/svc-dev-analytics
        property: secret
    - secretKey: SVC_COMPLIANCE_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/production/keycloak/svc-compliance
        property: secret
    # HCM-030 (PLAN-30 H): /careers/my one-time-code HMAC key (hr-core-web refuses to start in Production without it).
    - secretKey: Recruitment__Portal__OtpHmacKey
      remoteRef:
        key: /hrmanagement/production/hr-core/otp-hmac
        property: key
    - secretKey: SVC_AUTH_DIRECTORY_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/production/keycloak/svc-auth-directory
        property: secret
