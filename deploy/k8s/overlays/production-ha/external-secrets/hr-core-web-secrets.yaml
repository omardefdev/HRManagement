# PLAN-42 (G-IAM-13): this service's secrets and nothing else. docs/S2S_SECRET_MATRIX.md lists why each key is here.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hr-core-web-secrets
  labels:
    app.kubernetes.io/part-of: hrmanagement
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: hr-core-web-secrets
    creationPolicy: Owner
  data:
    - secretKey: ConnectionStrings__HRCoreDb
      remoteRef:
        key: /hrmanagement/production/postgres/hr-core
        property: connectionString
    - secretKey: GatewayCallerProof__PublicKeyPem
      remoteRef:
        key: /hrmanagement/production/gateway/proof
        property: publicKey
    - secretKey: RabbitMQ__Username
      remoteRef:
        key: /hrmanagement/production/rabbitmq/hr-core
        property: username
    - secretKey: RabbitMQ__Password
      remoteRef:
        key: /hrmanagement/production/rabbitmq/hr-core
        property: password
    - secretKey: SVC_HR_CORE_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/production/keycloak/svc-hr-core
        property: secret
    - secretKey: Recruitment__Portal__OtpHmacKey
      remoteRef:
        key: /hrmanagement/production/hr-core/otp-hmac
        property: key
