# PLAN-42 (G-IAM-13): this service's secrets and nothing else. docs/S2S_SECRET_MATRIX.md lists why each key is here.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: it-infra-web-secrets
  labels:
    app.kubernetes.io/part-of: hrmanagement
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: it-infra-web-secrets
    creationPolicy: Owner
  data:
    - secretKey: ConnectionStrings__ITInfraDb
      remoteRef:
        key: /hrmanagement/production/postgres/it-infra
        property: connectionString
    - secretKey: GatewayCallerProof__PublicKeyPem
      remoteRef:
        key: /hrmanagement/production/gateway/proof
        property: publicKey
    - secretKey: RabbitMQ__Username
      remoteRef:
        key: /hrmanagement/production/rabbitmq/it-infra
        property: username
    - secretKey: RabbitMQ__Password
      remoteRef:
        key: /hrmanagement/production/rabbitmq/it-infra
        property: password
    - secretKey: SVC_IT_INFRA_CLIENT_SECRET
      remoteRef:
        key: /hrmanagement/production/keycloak/svc-it-infra
        property: secret
