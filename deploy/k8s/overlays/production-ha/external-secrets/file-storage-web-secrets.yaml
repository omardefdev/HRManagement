# PLAN-42 (G-IAM-13): this service's secrets and nothing else. docs/S2S_SECRET_MATRIX.md lists why each key is here.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: file-storage-web-secrets
  labels:
    app.kubernetes.io/part-of: hrmanagement
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: file-storage-web-secrets
    creationPolicy: Owner
  data:
    - secretKey: ConnectionStrings__FileStorageDb
      remoteRef:
        key: /hrmanagement/production/postgres/file-storage
        property: connectionString
    - secretKey: GatewayCallerProof__PublicKeyPem
      remoteRef:
        key: /hrmanagement/production/gateway/proof
        property: publicKey
    - secretKey: RabbitMQ__Username
      remoteRef:
        key: /hrmanagement/production/rabbitmq/file-storage
        property: username
    - secretKey: RabbitMQ__Password
      remoteRef:
        key: /hrmanagement/production/rabbitmq/file-storage
        property: password
    - secretKey: FileStorage__AccessKey
      remoteRef:
        key: /hrmanagement/production/minio/filestorage
        property: accessKey
    - secretKey: FileStorage__SecretKey
      remoteRef:
        key: /hrmanagement/production/minio/filestorage
        property: secretKey
