apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: hrmanagement-observability
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      batch: {}
      attributes/pii:
        actions:
          - key: NationalId
            action: delete
          - key: password
            action: delete
          - key: db.statement
            action: delete
    exporters:
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true
      logging:
        loglevel: warn
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [attributes/pii, batch]
          exporters: [otlp/tempo, logging]
