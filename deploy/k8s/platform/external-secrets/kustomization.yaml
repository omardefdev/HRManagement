# External Secrets Operator platform pieces (OPS-005).
# Install ESO chart/operator first (version-pin in ops runbook), then apply this kustomization.
# Replace ESO_ROLE_ARN with terraform output eso_role_arn (IRSA).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: external-secrets
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - cluster-secret-store.yaml
