apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hr-postgres-superuser
  namespace: hrmanagement-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: hr-postgres-superuser
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: /hrmanagement/staging/postgres/superuser
        property: username
    - secretKey: password
      remoteRef:
        key: /hrmanagement/staging/postgres/superuser
        property: password
---
