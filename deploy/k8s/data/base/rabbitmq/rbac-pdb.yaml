apiVersion: v1
kind: ServiceAccount
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: hrmanagement
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rabbitmq-peer-discovery
  labels:
    app.kubernetes.io/name: rabbitmq
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rabbitmq-peer-discovery
  labels:
    app.kubernetes.io/name: rabbitmq
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rabbitmq-peer-discovery
subjects:
  - kind: ServiceAccount
    name: rabbitmq
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-erlang-cookie
  labels:
    app.kubernetes.io/name: rabbitmq
    hrmanagement.io/secret-source: dev-only-placeholder
type: Opaque
stringData:
  cookie: "replace-me-erlang-cookie-change-in-prod"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
