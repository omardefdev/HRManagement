apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hrmanagement-data
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: hrmanagement
    includeSelectors: false
resources:
  - namespace.yaml
  - secrets-placeholder.yaml
  - postgres/cluster.yaml
  - postgres/pooler.yaml
  - postgres/backup-secrets.yaml
  - postgres/scheduled-backup.yaml
  - rabbitmq/configmap.yaml
  - rabbitmq/service.yaml
  - rabbitmq/rbac-pdb.yaml
  - rabbitmq/statefulset.yaml
  - keycloak/deployment.yaml
  - minio/statefulset.yaml
  - backup/cronjobs.yaml
  - backup/catalog-pvc.yaml
