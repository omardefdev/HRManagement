apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-gateway
  labels:
    app.kubernetes.io/name: hr-gateway
    app.kubernetes.io/part-of: hrmanagement
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hr-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hr-gateway
        app.kubernetes.io/part-of: hrmanagement
    spec:
      terminationGracePeriodSeconds: 45
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: hr-gateway
              topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: hr-gateway
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: app
          image: ghcr.io/OWNER/hrmanagement/hr-gateway:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hr-app-config
                optional: true
            - configMapRef:
                name: hr-gateway-yarp
                optional: false
            - secretRef:
                name: hr-app-secrets
                optional: true
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: hr-app-config
                  key: ASPNETCORE_ENVIRONMENT
                  optional: true
            - name: ASPNETCORE_SHUTDOWNTIMEOUTSECONDS
              value: "30"
            - name: Database__RunMigrationsAtStartup
              value: "false"

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      # No container_name — Kubernetes assigns unique pod names for HA.

