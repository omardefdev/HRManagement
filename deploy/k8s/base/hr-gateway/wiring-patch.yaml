# PLAN-37 (D-INT-2): service wiring from deploy/wiring/service-wiring.json. Generated values; ProductionWiringMatrixTests
# and scripts/int037-wiring-check.ps1 compare them with the matrix. The secret comes from hr-gateway-secrets (PLAN-42: one
# ExternalSecret per service).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-gateway
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: Integration__HrCoreBaseUrl
              value: http://hr-core-web:8080
            - name: Integration__AuthDirectoryBaseUrl
              value: http://auth-directory-web:8080
