# PLAN-37 (D-INT-2): service wiring from deploy/wiring/service-wiring.json. Generated values; ProductionWiringMatrixTests
# and scripts/int037-wiring-check.ps1 compare them with the matrix. The secret comes from hr-training-web-secrets (PLAN-42: one
# ExternalSecret per service).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-training-web
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: Integration__HrCoreBaseUrl
              value: http://hr-core-web:8080
            - name: HrGateway__InternalBaseUrl
              value: http://hr-gateway:8080
            - name: ServiceIdentity__ClientId
              value: svc-hr-training
            - name: ServiceIdentity__Scope
              value: file-storage.references
            - name: ServiceIdentity__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: hr-training-web-secrets
                  key: SVC_HR_TRAINING_CLIENT_SECRET
