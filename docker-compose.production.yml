# Production overrides. Valid on its own (PLAN-36): the applications sit behind the full-stack profile.
#   docker compose -f docker-compose.yml -f docker-compose.services.yml -f docker-compose.images.yml \
#     -f docker-compose.production.yml --profile full-stack up -d
# Full observability stack: append -f docker-compose.observability.yml -f docker-compose.observability.production.yml.
# Single host behind the Caddy edge: docker-compose.vps.yml (docs/OPS_VPS_SINGLE_HOST.md).
#
# SEC-001: only Gateway (and optionally Keycloak for IdP redirects) publish host ports.
# All other listeners stay on isolated Docker networks. See docs/NETWORK_MATRIX.md.

x-app-production-env: &app-production-env
  ASPNETCORE_ENVIRONMENT: Production
  Database__RunMigrationsAtStartup: "false"
  Serilog__SeqUrl: http://seq:5341
  OpenTelemetry__Enabled: ${HRM_OTEL_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${HRM_OTEL_ENDPOINT:-http://otel-collector:4317}
  # PLAN-36: the authority is the internal http://keycloak:8080 on the data network, so its metadata is plain HTTP;
  # tokens are issued for the public https://SSO_DOMAIN issuer behind the edge.
  Keycloak__RequireHttpsMetadata: "false"
  Keycloak__AdditionalValidIssuers: https://${SSO_DOMAIN:?SSO_DOMAIN required}/realms/hrmanagement
  # Module listeners are internal only and every request must carry the gateway caller proof (SEC-001); the
  # gateway sets its own AllowedHosts to the public name.
  AllowedHosts: "*"
  GatewayCallerProof__Secret: ${GATEWAY_CALLER_PROOF_SECRET:?GATEWAY_CALLER_PROOF_SECRET required (at least 32 characters)}
  # PLAN-36: Data Protection key rings on named volumes (mount only; guard and encryption are PLAN-39).
  DataProtection__KeyRingPath: /var/hrm/dpkeys
  Deployment__RequireLicenseKey: ${HRM_REQUIRE_LICENSE:-false}

x-app-messaging-env: &app-messaging-env
  RabbitMQ__Host: rabbitmq
  RabbitMQ__Port: 5672
  RabbitMQ__VirtualHost: /
  # IAM-004: override RabbitMQ__Username/Password per service (do not use DEFAULT admin in apps).
  # SEC-004: fail-closed — no default RabbitMQ credentials in production.
  RabbitMQ__Username: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER required}
  RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS required}
  Keycloak__Authority: ${KEYCLOAK_AUTHORITY:-http://keycloak:8080/realms/hrmanagement}
  HrAuth__BehindGateway: "true"
  HealthChecks__IncludeRabbitMq: "true"
  # IAM-004: MinIO credentials must NOT be injected into every service — only file-storage-web.

x-app-healthcheck: &app-healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 60s

# PLAN-36 (P-5): survive a cold start and a host reboot. Docker restarts these containers itself after a reboot,
# without compose ordering, so a service that starts before PostgreSQL is ready exits and is restarted.
x-app-runtime: &app-runtime
  restart: unless-stopped

x-app-resources: &app-resources
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M
      reservations:
        cpus: "0.25"
        memory: 256M

# HARD-001: full container hardening for ASP.NET app services (non-root images + cap drop).
x-app-hardening: &app-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# HARD-001: mild hardening for data-plane / JVM / Erlang — do NOT cap_drop ALL (breaks init).
x-infra-hardening-mild: &infra-hardening-mild
  security_opt:
    - no-new-privileges:true

services:
  # PLAN-36 (P-5, PLAN-35 defect 5): a new named volume is created root-owned, but the application images run as the
  # non-root user 1654. This one-shot container gives every application volume to that user before any application
  # starts (idempotent; it exits 0 and is not restarted).
  volume-init:
    image: alpine:3.20.3
    user: "0:0"
    network_mode: none
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    command: ["sh", "-c", "chown -R 1654:1654 /v && echo volume-init: application volumes owned by 1654"]
    volumes:
      - gateway_dataprotection_keys:/v/gateway-dpkeys
      - file_storage_data:/v/files
      - hr_core_integration_outbox:/v/hr-core-outbox
      - payroll_integration_outbox:/v/payroll-outbox
      - dp_hr_core:/v/dp_hr_core
      - dp_hr_contracts:/v/dp_hr_contracts
      - dp_hr_health:/v/dp_hr_health
      - dp_hr_movements:/v/dp_hr_movements
      - dp_hr_training:/v/dp_hr_training
      - dp_payroll:/v/dp_payroll
      - dp_idcard:/v/dp_idcard
      - dp_records_archive:/v/dp_records_archive
      - dp_admin_logistics:/v/dp_admin_logistics
      - dp_it_infra:/v/dp_it_infra
      - dp_dev_analytics:/v/dp_dev_analytics
      - dp_compliance:/v/dp_compliance
      - dp_auth_directory:/v/dp_auth_directory
      - dp_file_storage:/v/dp_file_storage
    deploy:
      resources:
        limits:
          memory: 32M

  postgresql:
    <<: *infra-hardening-mild
    ports: !override []
    networks: !override
      - data
    deploy:
      resources:
        limits:
          memory: 1G

  rabbitmq:
    <<: *infra-hardening-mild
    ports: !override []
    networks: !override
      - data
    deploy:
      resources:
        limits:
          memory: 512M

  clamav:
    <<: *infra-hardening-mild
    ports: !override []
    networks: !override
      - application
      - data
    deploy:
      resources:
        limits:
          memory: 2G

  # PLAN-36 (D-36-3): optional. The pinned image is no longer pullable, so the owner supplies a vetted, digest-pinned
  # MINIO_IMAGE and enables --profile minio. Compose interpolates inactive services too, so neither the image nor the
  # root credentials can be ":?" here; scripts/vps/lint-compose.ps1 fails when the minio profile is enabled with an
  # empty MINIO_IMAGE, MINIO_ROOT_USER or MINIO_ROOT_PASSWORD.
  minio:
    <<: *infra-hardening-mild
    profiles: !override ["minio"]
    image: ${MINIO_IMAGE:-}
    restart: unless-stopped
    ports: !override []
    networks: !override
      - data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 512M

  keycloak:
    <<: *infra-hardening-mild
    command: start
    # IdP must be reachable by browsers; restrict via firewall/VPN in real deployments.
    ports: !override
      - "${KEYCLOAK_HTTP_PORT:-8080}:8080"
    networks: !override
      - edge
      - data
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgresql:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER required}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      KC_PROXY: edge
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_STRICT_HTTPS: "true"
      KC_HTTP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 768M

  postgres-backup:
    image: postgres:16-alpine
    container_name: hrm-postgres-backup
    profiles: ["backup"]
    networks: !override
      - data
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      # Prefer hrm_backup (OPS-003); fall back to POSTGRES_* for bootstrap
      POSTGRES_USER: ${POSTGRES_BACKUP_USER:-${POSTGRES_USER}}
      POSTGRES_PASSWORD: ${POSTGRES_BACKUP_PASSWORD:-${POSTGRES_PASSWORD}}
      BACKUP_PGUSER: ${POSTGRES_BACKUP_USER:-hrm_backup}
      BACKUP_PGPASSWORD: ${POSTGRES_BACKUP_PASSWORD:-${POSTGRES_PASSWORD}}
      PGHOST: postgresql
      PGPORT: "5432"
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_CATALOG_PATH: /backups/postgres/backup-catalog.jsonl
    volumes:
      - ./scripts/backup-postgres.sh:/backup/backup-postgres.sh:ro
      - ./scripts/lib:/backup/lib:ro
      - postgres_backups:/backups/postgres
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # OPS-003: full inventory incl. file_storage_db; writes checksums + catalog
        mkdir -p /backup/scripts && cp /backup/backup-postgres.sh /tmp/backup-postgres.sh
        # script sources ../scripts/lib — provide layout
        mkdir -p /work/scripts/lib
        cp /backup/backup-postgres.sh /work/scripts/backup-postgres.sh
        cp /backup/lib/backup-catalog.sh /work/scripts/lib/backup-catalog.sh
        chmod +x /work/scripts/backup-postgres.sh
        while true; do
          /work/scripts/backup-postgres.sh /backups/postgres
          sleep 86400
        done
    restart: unless-stopped

  # PLAN-36: backs up MinIO only when MinIO runs (profile minio); --profile backup alone covers PostgreSQL.
  minio-backup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["minio"]
    networks: !override
      - data
    depends_on:
      - minio
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_BACKUP_ACCESS_KEY:-${MINIO_ROOT_USER}}
      MINIO_SECRET_KEY: ${MINIO_BACKUP_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      MINIO_BACKUP_DIR: /backups/minio
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_CATALOG_PATH: /backups/minio/backup-catalog.jsonl
    volumes:
      - ./scripts/backup-minio.sh:/backup/backup-minio.sh:ro
      - ./scripts/lib/backup-catalog.sh:/backup/lib/backup-catalog.sh:ro
      - minio_backups:/backups/minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /work/scripts/lib
        cp /backup/backup-minio.sh /work/scripts/backup-minio.sh
        cp /backup/lib/backup-catalog.sh /work/scripts/lib/backup-catalog.sh
        chmod +x /work/scripts/backup-minio.sh
        while true; do
          /work/scripts/backup-minio.sh || true
          sleep 86400
        done
    restart: unless-stopped

  hr-gateway:
    <<: [*app-resources, *app-hardening, *app-runtime]
    ports: !override
      - "${GATEWAY_HTTP_PORT:-5000}:8080"
    networks: !override
      - edge
      - application
      - data
    environment:
      <<: *app-production-env
      ConnectionStrings__GatewayAuditDb: Host=postgresql;Port=5432;Database=gateway_audit_db;Username=gateway_audit_app;Password=${POSTGRES_GATEWAY_AUDIT_APP_PASSWORD:-${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}}
      RabbitMQ__Username: mq_gateway
      RabbitMQ__Password: ${RABBITMQ_GATEWAY_PASS:-${RABBITMQ_SERVICE_PASSWORD:-${RABBITMQ_DEFAULT_PASS}}}
      Keycloak__Authority: ${KEYCLOAK_AUTHORITY:-http://keycloak:8080/realms/hrmanagement}
      Keycloak__ClientId: hr-gateway-client
      Keycloak__ClientSecret: ${KEYCLOAK_HR_GATEWAY_CLIENT_SECRET:?KEYCLOAK_HR_GATEWAY_CLIENT_SECRET required}
      Keycloak__RequireHttpsMetadata: ${KEYCLOAK_REQUIRE_HTTPS_METADATA:-false}
      # PLAN-36 (G-OPS-01): explicit public settings instead of the dev values inherited from docker-compose.yml
      # (the loopback dev authority and two modules).
      Keycloak__PublicAuthority: https://${SSO_DOMAIN:?SSO_DOMAIN required}/realms/hrmanagement
      Keycloak__AdditionalValidIssuers: https://${SSO_DOMAIN:?SSO_DOMAIN required}/realms/hrmanagement
      HrAuth__BehindGateway: "false"
      AllowedHosts: ${APP_DOMAIN:?APP_DOMAIN required};localhost
      Organization__Name: ${HRM_ORGANIZATION_NAME:-شعبة التنظيم والموارد البشرية}
      Gateway__EnabledModules__0: hr-core
      Gateway__EnabledModules__1: hr-contracts
      Gateway__EnabledModules__2: hr-health
      Gateway__EnabledModules__3: hr-movements
      Gateway__EnabledModules__4: hr-training
      Gateway__EnabledModules__5: payroll
      Gateway__EnabledModules__6: idcard
      Gateway__EnabledModules__7: records-archive
      Gateway__EnabledModules__8: admin-logistics
      Gateway__EnabledModules__9: it-infra
      Gateway__EnabledModules__10: dev-analytics
      Gateway__EnabledModules__11: compliance
      Gateway__EnabledModules__12: auth-directory
      Gateway__EnabledModules__13: file-storage
      Integration__AuthDirectoryBaseUrl: http://auth-directory-web:8080
      UseForwardedHeaders: "true"
      # Shared key ring: without it each gateway replica encrypts OIDC state with its own keys and
      # interactive login breaks whenever the callback lands on a different replica.
      DataProtection__KeyRingPath: /var/hrm/dataprotection-keys
      ReverseProxy__Clusters__hr-core-cluster__Destinations__destination1__Address: http://hr-core-web:8080
      ReverseProxy__Clusters__hr-contracts-cluster__Destinations__destination1__Address: http://hr-contracts-web:8080
      ReverseProxy__Clusters__hr-health-cluster__Destinations__destination1__Address: http://hr-health-web:8080
      ReverseProxy__Clusters__hr-movements-cluster__Destinations__destination1__Address: http://hr-movements-web:8080
      ReverseProxy__Clusters__hr-training-cluster__Destinations__destination1__Address: http://hr-training-web:8080
      ReverseProxy__Clusters__payroll-cluster__Destinations__destination1__Address: http://payroll-web:8080
      ReverseProxy__Clusters__idcard-cluster__Destinations__destination1__Address: http://idcard-web:8080
      ReverseProxy__Clusters__records-archive-cluster__Destinations__destination1__Address: http://records-archive-web:8080
      ReverseProxy__Clusters__admin-logistics-cluster__Destinations__destination1__Address: http://admin-logistics-web:8080
      ReverseProxy__Clusters__it-infra-cluster__Destinations__destination1__Address: http://it-infra-web:8080
      ReverseProxy__Clusters__dev-analytics-cluster__Destinations__destination1__Address: http://dev-analytics-web:8080
      ReverseProxy__Clusters__compliance-cluster__Destinations__destination1__Address: http://compliance-web:8080
      ReverseProxy__Clusters__auth-directory-cluster__Destinations__destination1__Address: http://auth-directory-web:8080
      ReverseProxy__Clusters__file-storage-cluster__Destinations__destination1__Address: http://file-storage-web:8080
    volumes:
      - gateway_dataprotection_keys:/var/hrm/dataprotection-keys
    healthcheck: *app-healthcheck
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      hr-core-web:
        condition: service_healthy

  hr-core-web:
    <<: [*app-resources, *app-hardening, *app-runtime]
    ports: !override []
    networks: !override
      - application
      - data
    environment:
      <<: [*app-production-env, *app-messaging-env]
      ConnectionStrings__HRCoreDb: Host=postgresql;Port=5432;Database=hr_core_db;Username=hr_core_app;Password=${POSTGRES_HR_CORE_APP_PASSWORD:-${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}}
      RabbitMQ__Username: mq_hr_core
      RabbitMQ__Password: ${RABBITMQ_HR_CORE_PASS:-${RABBITMQ_SERVICE_PASSWORD:-${RABBITMQ_DEFAULT_PASS}}}
      ServiceIdentity__ClientId: svc-hr-core
      ServiceIdentity__ClientSecret: ${SVC_HR_CORE_CLIENT_SECRET:?SVC_HR_CORE_CLIENT_SECRET required}
      ServiceIdentity__Scope: file-storage.references
      ServiceIdentity__ApiAudience: api-hr-core
      # HCM-030 (PLAN-30 H): /careers/my one-time-code HMAC key (>= 32 chars); hr-core refuses to start without it.
      Recruitment__Portal__OtpHmacKey: ${HR_CORE_OTP_HMAC_KEY:?HR_CORE_OTP_HMAC_KEY required}
      Keycloak__AdditionalValidAudiences: api-hr-core;hr-gateway-client
      Organization__Name: ${HRM_ORGANIZATION_NAME:-شعبة التنظيم والموارد البشرية}
      # PLAN-36 (D-36-3): HR.Core never registers the file storage service (File.Storage owns the bytes and HR.Core
      # reaches it with its service identity), so it gets no file volume; the provider is set only so that the dev
      # value from docker-compose.yml does not linger.
      FileStorage__Provider: ${HRM_FILE_PROVIDER:-Local}
      FileStorage__LocalRootPath: /var/hrm/files
      # SEC-004 / IAM-004: clear dev MinIO defaults — hr-core uses service identity, not direct MinIO.
      FileStorage__AccessKey: ""
      FileStorage__SecretKey: ""
    volumes:
      - dp_hr_core:/var/hrm/dpkeys
      - hr_core_integration_outbox:/app/integration-outbox
    healthcheck: *app-healthcheck
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started

  hr-contracts-web:
    <<: [*app-resources, *app-hardening, *app-runtime]
    ports: !override []
    networks: !override
