    environment:
      <<: [*app-production-env, *app-messaging-env]
      ConnectionStrings__AuthDirectoryDb: Host=postgresql;Port=5432;Database=auth_directory_db;Username=auth_directory_app;Password=${POSTGRES_AUTH_DIRECTORY_APP_PASSWORD:-${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}}
      RabbitMQ__Username: mq_auth_directory
      RabbitMQ__Password: ${RABBITMQ_AUTH_DIRECTORY_PASS:-${RABBITMQ_SERVICE_PASSWORD:-${RABBITMQ_DEFAULT_PASS}}}
      Keycloak__DirectorySync__AdminClientSecret: ${KEYCLOAK_DIRECTORY_SYNC_SECRET:?KEYCLOAK_DIRECTORY_SYNC_SECRET required}
      ServiceIdentity__ApiAudience: api-auth-directory
      Keycloak__AdditionalValidAudiences: api-auth-directory;hr-gateway-client
    volumes:
      - dp_auth_directory:/var/hrm/dpkeys
    healthcheck: *app-healthcheck
    depends_on:
