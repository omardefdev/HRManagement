      ServiceIdentity__ClientId: svc-hr-contracts
      ServiceIdentity__ClientSecret: ${SVC_HR_CONTRACTS_CLIENT_SECRET:?SVC_HR_CONTRACTS_CLIENT_SECRET required}
      ServiceIdentity__Scope: file-storage.references
    volumes:
