  file-storage-web:
    <<: [*app-resources, *app-hardening, *app-runtime]
    ports: !override []
    networks: !override
      - application
      - data
    environment:
      <<: [*app-production-env, *app-messaging-env]
      ConnectionStrings__FileStorageDb: Host=postgresql;Port=5432;Database=file_storage_db;Username=file_storage_app;Password=${POSTGRES_FILE_STORAGE_APP_PASSWORD:-${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}}
      RabbitMQ__Username: mq_file_storage
      RabbitMQ__Password: ${RABBITMQ_FILE_STORAGE_PASS:-${RABBITMQ_SERVICE_PASSWORD:-${RABBITMQ_DEFAULT_PASS}}}
      ServiceIdentity__ApiAudience: api-file-storage
      Keycloak__AdditionalValidAudiences: api-file-storage;hr-gateway-client
      # PLAN-36 (D-36-3): Local provider on the file_storage_data volume by default. HRM_FILE_PROVIDER=Minio needs
      # --profile minio, a vetted MINIO_IMAGE and the MinIO app credentials below; the production configuration
      # guard refuses to start File.Storage on Minio with empty or placeholder keys. Compose cannot require them with
      # ":?" because it interpolates inactive services too.
      FileStorage__Provider: ${HRM_FILE_PROVIDER:-Local}
      FileStorage__LocalRootPath: /var/hrm/files
      # IAM-004: MinIO app credentials for File.Storage only (not root)
      FileStorage__Endpoint: minio:9000
      FileStorage__AccessKey: ${MINIO_FILESTORAGE_ACCESS_KEY:-}
      FileStorage__SecretKey: ${MINIO_FILESTORAGE_SECRET_KEY:-}
      FileStorage__UseSsl: "false"
      # Anti-virus is mandatory in production: an unreachable daemon must yield ScanError, never
      # a clean verdict. Uploads stay quarantined until a real scan succeeds.
      FileStorage__ClamAvHost: ${CLAMAV_HOST:-clamav}
      FileStorage__ClamAvPort: "${CLAMAV_PORT:-3310}"
      FileStorage__ClamAvRequired: "true"
    volumes:
      - dp_file_storage:/var/hrm/dpkeys
      - file_storage_data:/var/hrm/files
    healthcheck: *app-healthcheck
    depends_on:
      volume-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

networks:
  edge:
    driver: bridge
  application:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true
  observability:
    driver: bridge
    internal: true

volumes:
  # Shared Data Protection key ring for the gateway. Must survive restarts and be reachable by
  # every replica, otherwise OIDC sign-in breaks across replicas.
  gateway_dataprotection_keys:
  postgres_backups:
  minio_backups:
  minio_data:
  hr_core_integration_outbox:
  payroll_integration_outbox:
  file_storage_data:
  # PLAN-36: one Data Protection key ring per module (mount only; PLAN-39 adds the guard and encryption).
  dp_hr_core:
  dp_hr_contracts:
  dp_hr_health:
  dp_hr_movements:
  dp_hr_training:
  dp_payroll:
  dp_idcard:
  dp_records_archive:
  dp_admin_logistics:
  dp_it_infra:
  dp_dev_analytics:
  dp_compliance:
  dp_auth_directory:
  dp_file_storage:
