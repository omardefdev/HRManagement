      FileStorage__SecretKey: ${MINIO_FILESTORAGE_SECRET_KEY:?MINIO_FILESTORAGE_SECRET_KEY required}
      FileStorage__UseSsl: "false"
      # Anti-virus is mandatory in production: an unreachable daemon must yield ScanError, never
      # a clean verdict. Uploads stay quarantined until a real scan succeeds.
      FileStorage__ClamAvHost: ${CLAMAV_HOST:-clamav}
      FileStorage__ClamAvPort: "${CLAMAV_PORT:-3310}"
      FileStorage__ClamAvRequired: "true"
    healthcheck: *app-healthcheck
    depends_on:
      clamav:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  # Observability — no public host ports (Grafana bound to loopback only).
  # Requires docker-compose.observability.yml in the same compose invocation.
  seq:
    ports: !override []
    networks: !override
      - observability
      - application

  tempo:
    ports: !override []
    networks: !override
      - observability

  otel-collector:
    ports: !override []
    networks: !override
      - observability
      - application

  prometheus:
    ports: !override []
    networks: !override
      - observability
      - application

  alertmanager:
    ports: !override []
    networks: !override
      - observability

  alert-sink:
    ports: !override []
    networks: !override
      - observability

  blackbox-exporter:
    ports: !override []
    networks: !override
      - observability
      - application

  grafana:
    ports: !override
      - "127.0.0.1:${GRAFANA_HTTP_PORT:-3000}:3000"
    networks: !override
      - observability
    environment:
      # SEC-004: no default admin/admin in production (overrides docker-compose.observability.yml).
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD required}

  rabbitmq-exporter:
    ports: !override []
    networks: !override
      - observability
      - data

  postgres-exporter:
    ports: !override []
    networks: !override
      - observability
      - data

networks:
  edge:
    driver: bridge
  application:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true
  observability:
    driver: bridge
    internal: true

volumes:
  # Shared Data Protection key ring for the gateway. Must survive restarts and be reachable by
  # every replica, otherwise OIDC sign-in breaks across replicas.
  gateway_dataprotection_keys:
  postgres_backups:
  minio_backups:
  minio_data:
  hr_core_integration_outbox:
  payroll_integration_outbox:
