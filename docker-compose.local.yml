services:
  keycloak:
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8088
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"

  hr-core-web:
    environment:
      HrGateway__PublicBaseUrl: http://localhost:5200
      HrGateway__InternalBaseUrl: http://hr-gateway:8080
      Keycloak__AdditionalValidIssuers: http://localhost:8088/realms/hrmanagement

  hr-contracts-web:
