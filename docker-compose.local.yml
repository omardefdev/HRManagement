services:
  keycloak:
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8088
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"

  hr-core-web:
    environment:
      SEED_ACCEPTANCE: ${SEED_ACCEPTANCE:-false}
      Seed__Acceptance: ${SEED_ACCEPTANCE:-false}
      HrGateway__PublicBaseUrl: http://localhost:5200
      HrGateway__InternalBaseUrl: http://hr-gateway:8080
      Keycloak__AdditionalValidIssuers: http://localhost:8088/realms/hrmanagement
      Keycloak__AdditionalValidAudiences: api-hr-core;hr-gateway-client
      # HCM-027 (E2): offer salary bounds from Payroll pay grades (S2S, scope payroll.grades.read).
      # Dev/acceptance only; without Integration__PayrollBaseUrl HR.Core treats Payroll as unavailable.
      Integration__PayrollBaseUrl: http://payroll-web:8080
      # Same lab-only value sync-keycloak-dev-realm.ps1 sets on every service client (not .env SVC_* values).
      ServiceIdentity__ClientSecret: dev-svc-secret-local-only
      # PLAN-30 (FS-030): file-storage.service-upload relays candidate documents to File.Storage (S2S).
      ServiceIdentity__Scope: file-storage.references payroll.grades.read file-storage.service-upload
      # PLAN-30 (HCM-030 E2): candidate documents go to File.Storage directly (caller proof signed), not via the gateway.
      Integration__FileStorageBaseUrl: http://file-storage-web:8080

  hr-contracts-web:
    environment:
      HrGateway__InternalBaseUrl: http://hr-gateway:8080
      Keycloak__AdditionalValidIssuers: http://localhost:8088/realms/hrmanagement

  hr-health-web:
    environment:
      Keycloak__AdditionalValidIssuers: http://localhost:8088/realms/hrmanagement

  hr-movements-web:
    environment:
      Keycloak__AdditionalValidIssuers: http://localhost:8088/realms/hrmanagement

  hr-training-web:
    environment:
      HrGateway__InternalBaseUrl: http://hr-gateway:8080
      Keycloak__AdditionalValidIssuers: http://localhost:8088/realms/hrmanagement

  payroll-web:
    environment:
      SEED_ACCEPTANCE: ${SEED_ACCEPTANCE:-false}
      Seed__Acceptance: ${SEED_ACCEPTANCE:-false}
      Keycloak__AdditionalValidIssuers: http://localhost:8088/realms/hrmanagement

  idcard-web:
    environment:
      HrGateway__InternalBaseUrl: http://hr-gateway:8080
      Keycloak__AdditionalValidIssuers: http://localhost:8088/realms/hrmanagement

  records-archive-web:
    environment:
      HrGateway__InternalBaseUrl: http://hr-gateway:8080
      Keycloak__AdditionalValidIssuers: http://localhost:8088/realms/hrmanagement

  admin-logistics-web:
    environment:
      Keycloak__AdditionalValidIssuers: http://localhost:8088/realms/hrmanagement
      HrGateway__InternalBaseUrl: http://hr-gateway:8080
      Integration__HrCoreBaseUrl: http://hr-core-web:8080
      ServiceIdentity__ClientId: svc-admin-logistics
      ServiceIdentity__ClientSecret: dev-svc-secret-local-only
      ServiceIdentity__Scope: hr-core.lookup hr-core.workflow file-storage.references

  it-infra-web:
    environment:
      Keycloak__AdditionalValidIssuers: http://localhost:8088/realms/hrmanagement

  dev-analytics-web:
    environment:
      Keycloak__AdditionalValidIssuers: http://localhost:8088/realms/hrmanagement

  compliance-web:
    environment:
      Keycloak__AdditionalValidIssuers: http://localhost:8088/realms/hrmanagement

  auth-directory-web:
    environment:
      Keycloak__AdditionalValidIssuers: http://localhost:8088/realms/hrmanagement

  hr-gateway:
    environment:
      Keycloak__Authority: http://keycloak:8080/realms/hrmanagement
      Keycloak__PublicAuthority: http://localhost:8088/realms/hrmanagement
      Keycloak__GetClaimsFromUserInfo: "false"
