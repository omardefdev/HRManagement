# docker-compose.override.yml
# BLD-002 dev workflow: infrastructure runs in Docker; .NET services run locally via dotnet run or the IDE.
# Full stack in containers: docker compose --profile full-stack -f docker-compose.yml -f docker-compose.services.yml up -d
# Rebuild one service: scripts/dev-build-service.ps1 -Service hr-core-web
#
# Optional future hot-reload bind mount (Phase 2):
# hr-core-web:
#   volumes:
#     - ./src/Services/HRCore:/src/Services/HRCore:ro

services: {}
