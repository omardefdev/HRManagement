    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FileStorageDb: Host=postgresql;Port=5432;Database=file_storage_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: ${RABBITMQ_DEFAULT_USER}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS}
      Keycloak__Authority: http://keycloak:8080/realms/hrmanagement
      Keycloak__RequireHttpsMetadata: "false"
      Keycloak__AdditionalValidIssuers: "http://localhost:8088/realms/hrmanagement"
      Keycloak__AdditionalValidAudiences: api-file-storage;hr-gateway-client
      HrAuth__BehindGateway: "true"
      # QA-034 (D-QA-7): Local provider on a volume by default (the pinned MinIO image is no longer pullable);
      # docker-compose.object-storage.yml switches to Minio. ClamAV stays required either way.
      FileStorage__Provider: ${FILE_STORAGE_PROVIDER:-Local}
      FileStorage__LocalRootPath: /var/hrm/file-storage
      FileStorage__Endpoint: minio:9000
      # SEC-004: dev-only root defaults — production uses dedicated app key via :?required.
      FileStorage__AccessKey: ${MINIO_ROOT_USER:-hrminio}
      FileStorage__SecretKey: ${MINIO_ROOT_PASSWORD:-hrminio_secret_change_me}
      FileStorage__UseSsl: "false"
      FileStorage__ClamAvHost: clamav
      FileStorage__ClamAvPort: "3310"
      FileStorage__ClamAvRequired: "true"
    volumes:
      - file_storage_data:/var/hrm/file-storage
    depends_on:
      clamav:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
