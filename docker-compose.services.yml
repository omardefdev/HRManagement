# Optional compose override: all 13 HR services + gateway.
# Host ports align with README / gateway appsettings (5010, 5020, …, 5130).
# Usage: docker compose -f docker-compose.yml -f docker-compose.services.yml up -d
services:

  hr-contracts-web:
    build:
      context: .
      dockerfile: src/Services/HRContracts/HR.Contracts.Web/Dockerfile
    container_name: hrm-hr-contracts-web
    ports:
      - "5020:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_PATHBASE: /ui/hr-contracts
      ConnectionStrings__ContractsDb: Host=postgresql;Port=5432;Database=hr_contracts_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_DEFAULT_USER}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS}
      Keycloak__Authority: http://keycloak:8080/realms/hrmanagement
      Keycloak__RequireHttpsMetadata: "false"
      Keycloak__AdditionalValidIssuers: "http://localhost:8088/realms/hrmanagement"
      HrAuth__BehindGateway: "true"
      HrGateway__InternalBaseUrl: http://hr-gateway:8080
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

