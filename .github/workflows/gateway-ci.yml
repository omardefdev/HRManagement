name: gateway-ci

on:
  pull_request:
    paths:
      - "src/Gateway/**"
      - "src/Shared/**"
      - "src/Tests/**"
      - "coverlet.runsettings"
      - ".github/workflows/gateway-ci.yml"
  push:
    branches: [ "main" ]
    paths:
      - "src/Gateway/**"
      - "src/Shared/**"
      - "src/Tests/**"
      - "coverlet.runsettings"
      - ".github/workflows/gateway-ci.yml"

jobs:
  test-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: PowerShell for Linux validation script tests
        run: |
          if command -v pwsh >/dev/null 2>&1 && ! command -v powershell >/dev/null 2>&1; then
            sudo ln -sf "$(command -v pwsh)" /usr/local/bin/powershell
          fi

      - name: Restore
        run: |
          dotnet restore src/Tests/HRManagement.UnitTests/HRManagement.UnitTests.csproj
          dotnet restore src/Tests/HRManagement.IntegrationTests/HRManagement.IntegrationTests.csproj

      - name: Check formatting
        run: dotnet format HRManagement.slnx --verify-no-changes --no-restore

      - name: Build
        run: |
          dotnet build src/Gateway/HRManagement.Gateway/HRManagement.Gateway.csproj --configuration Release --no-restore
          dotnet build src/Tests/HRManagement.UnitTests/HRManagement.UnitTests.csproj --configuration Release --no-restore
          dotnet build src/Tests/HRManagement.IntegrationTests/HRManagement.IntegrationTests.csproj --configuration Release --no-restore

      - name: Unit tests
        run: >
          dotnet test src/Tests/HRManagement.UnitTests/HRManagement.UnitTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=unit-results.trx"
          --results-directory ./TestResults/unit
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"

      - name: Integration tests (MassTransit InMemory)
        run: >
          dotnet test src/Tests/HRManagement.IntegrationTests/HRManagement.IntegrationTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=integration-results.trx"
          --results-directory ./TestResults/integration
          --filter "Category!=Testcontainers"
          --blame-hang-timeout 5m
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"

      - name: Coverage gate
        env:
          # QA-002: 60% on gateAssemblies + floors (coverage-floors.json)
          COVERAGE_THRESHOLD: "60"
        run: bash scripts/check-coverage.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/**/coverage.cobertura.xml

  e2e-gateway:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Start stack
        run: docker compose up -d --wait
      - name: Restore E2E project
        run: dotnet restore src/Tests/HRManagement.E2E/HRManagement.E2E.csproj
      - name: Build E2E project
        run: dotnet build src/Tests/HRManagement.E2E/HRManagement.E2E.csproj --configuration Release --no-restore
      - name: Install Playwright browsers
        run: pwsh src/Tests/HRManagement.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps
      - name: Run E2E tests (opt-in)
        env:
          RUN_PLAYWRIGHT_E2E: "true"
          GATEWAY_BASE_URL: "http://localhost:5000"
        run: dotnet test src/Tests/HRManagement.E2E/HRManagement.E2E.csproj --configuration Release
      - name: Tear down stack
        if: always()
        run: docker compose down -v
