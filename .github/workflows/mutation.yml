# QA-002-C: Mutation testing for sensitive payroll domain (not a per-PR gate).
name: Mutation (Payroll)

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  stryker-payroll:
    # PLAN-35 (G-QA-15): the schedule runs only after the owner sets ENABLE_SCHEDULED=true; dispatch always runs.
    if: github.event_name != 'schedule' || vars.ENABLE_SCHEDULED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore HRManagement.slnx --locked-mode

      # PLAN-35: a tool path, not "dotnet new tool-manifest --force", which wiped dotnet-ef from the repository manifest.
      - name: Install Stryker
        run: dotnet tool install dotnet-stryker --tool-path .tools --version 4.5.1

      - name: Run Stryker (Payroll.Domain)
        run: |
          ./.tools/dotnet-stryker -f tests/stryker-payroll.json --reporter "json" --reporter "html"
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-payroll-report
          path: |
            StrykerOutput/**/reports/**
            **/mutation-report.*
          if-no-files-found: warn
