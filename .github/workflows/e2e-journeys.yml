# QA-004: Journey E2E against release images (nightly + manual pre-release).
name: E2E Journeys (QA-004)

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "IMAGE_TAG (short SHA) for docker-compose.images.yml; empty = build from compose"
        required: false
        default: ""

# PLAN-35 (G-QA-15): scheduled runs only once the owner sets the repository variable ENABLE_SCHEDULED=true after the
# workflow is green; workflow_dispatch always runs.
jobs:
  journeys:
    if: github.event_name != 'schedule' || vars.ENABLE_SCHEDULED == 'true'
    # PLAN-35: ubuntu-latest is Ubuntu 26.04, where Playwright 1.50.1 cannot install Chromium (run 41099010391).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # PLAN-35: the stack builds every service image (the CI job ran out of disk doing the same).
      - name: Free runner disk space
        run: bash scripts/ci/free-runner-disk.sh

      - name: Start stack (release images when IMAGE_TAG set)
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          bash scripts/prepare-ci-compose-env.sh
          # PLAN-33: the application services carry profiles: ["full-stack"]; without the profile only infrastructure starts.
          if [ -n "${IMAGE_TAG}" ]; then
            echo "Using release images tag=${IMAGE_TAG}"
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.services.yml \
              -f docker-compose.images.yml \
              --profile full-stack up -d --wait
          else
            echo "No IMAGE_TAG — local compose build (pre-release lab)"
            # PLAN-35: build manifest, file-storage volume ownership and one cold-start retry (as the E2E job of ci.yml).
            bash scripts/ci/compose-up-retry.sh -f docker-compose.yml -f docker-compose.services.yml --profile full-stack
          fi

      - name: Restore / build E2E
        run: |
          dotnet restore src/Tests/HRManagement.E2E/HRManagement.E2E.csproj --locked-mode
          dotnet build src/Tests/HRManagement.E2E/HRManagement.E2E.csproj -c Release --no-restore

      - name: Install Playwright browsers
        run: pwsh src/Tests/HRManagement.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps

      # The requisition-to-hire journey needs the acceptance stack (personas, seed, FileDrop) and runs in its own job
      # below, on the lab profile and then on the prod-like profile (Category=JourneyProdLike, PLAN-25).
      - name: Run journey suite
        env:
          RUN_PLAYWRIGHT_E2E: "true"
          GATEWAY_BASE_URL: "http://localhost:5000"
          E2E_ARTIFACTS_DIR: "TestResults/e2e-artifacts"
        run: >
          dotnet test src/Tests/HRManagement.E2E/HRManagement.E2E.csproj
          --configuration Release --no-build
          --filter "(Category=Journey&FullyQualifiedName!~RecruitmentToHireJourney)|FullyQualifiedName~E2eSeedPackTests"
          --logger "trx;LogFileName=e2e-journey-results.trx"
          --results-directory ./TestResults/e2e-journeys

      - name: Fail on skipped mandatory journeys
        if: always()
        run: |
          # Zero-skip policy (as in ci.yml e2e): a skipped journey is a failure.
          if [ -f ./TestResults/e2e-journeys/e2e-journey-results.trx ]; then
            skipped=$(grep -o 'outcome="NotExecuted"' ./TestResults/e2e-journeys/e2e-journey-results.trx | wc -l || true)
            echo "Skipped journeys: ${skipped}"
            if [ "${skipped}" -gt 0 ]; then
              echo "::error::Mandatory journeys skipped (${skipped})."
              exit 1
            fi
          fi

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-journey-artifacts
          path: |
            TestResults/e2e-journeys/**
            TestResults/e2e-artifacts/**
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.services.yml --profile full-stack down -v || true

  # PLAN-33 (AC-HCM-33c): requisition → approval → public application → selection → offer → candidate OTP acceptance →
  # hire → HR.Contracts appointment, on the acceptance profile (lab scale) and then with the Production recruitment values
  # (docker-compose.acceptance-prodlike.yml, PLAN-25).
  recruitment-journey:
    if: github.event_name != 'schedule' || vars.ENABLE_SCHEDULED == 'true'
    # PLAN-35: ubuntu-latest is Ubuntu 26.04, where Playwright 1.50.1 cannot install Chromium (run 41099010391).
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # PLAN-35: the stack builds every service image (the CI job ran out of disk doing the same).
      - name: Free runner disk space
        run: bash scripts/ci/free-runner-disk.sh

      - name: Start acceptance stack
        shell: pwsh
        run: |
          bash scripts/prepare-ci-compose-env.sh
          ./scripts/acceptance-up.ps1 -SkipLiveVerification

      - name: Restore / build E2E
        run: |
          dotnet restore src/Tests/HRManagement.E2E/HRManagement.E2E.csproj --locked-mode
          dotnet build src/Tests/HRManagement.E2E/HRManagement.E2E.csproj -c Release --no-restore

      - name: Run requisition-to-hire journey
        env:
          RUN_PLAYWRIGHT_E2E: "true"
          GATEWAY_BASE_URL: "http://localhost:6200"
          KEYCLOAK_BASE_URL: "http://localhost:6388"
          KEYCLOAK_HR_GATEWAY_CLIENT_SECRET: ci-gateway-secret-lab-only
          COMPOSE_PROJECT_NAME: hrm-acceptance
        run: >
          dotnet test src/Tests/HRManagement.E2E/HRManagement.E2E.csproj
          --configuration Release --no-build
          --filter "Category=Journey&FullyQualifiedName~RecruitmentToHireJourneyE2ETests"
          --logger "trx;LogFileName=recruitment-journey-results.trx"
          --results-directory ./TestResults/recruitment-journey

      - name: Fail on skipped recruitment journey
        if: always()
        run: |
          trx=./TestResults/recruitment-journey/recruitment-journey-results.trx
          if [ ! -f "$trx" ]; then echo "::error::No test results"; exit 1; fi
          skipped=$(grep -o 'outcome="NotExecuted"' "$trx" | wc -l || true)
          executed=$(grep -o 'outcome="Passed"' "$trx" | wc -l || true)
          echo "Passed: ${executed}, skipped: ${skipped}"
          if [ "${skipped}" -gt 0 ] || [ "${executed}" -lt 1 ]; then
            echo "::error::The recruitment journey did not run and pass."
            exit 1
          fi

      # PLAN-25 (decision 10, G-02 closed): the same journey with the Production recruitment values
      # (docker-compose.acceptance-prodlike.yml), zero-skip.
      - name: Switch hr-core-web and hr-contracts-web to the prod-like profile
        shell: pwsh
        run: |
          # PLAN-35: the acceptance compose files need the variables acceptance-up.ps1 imports in its own step
          # (ACCEPTANCE_GATEWAY_CALLER_PROOF_SECRET, run 41140244680); load them the same way.
          $ErrorActionPreference = "Stop"
          . ./scripts/acceptance-local-env.ps1
          Import-AcceptanceLocalEnvironment -RepoRoot (Get-Location).Path
          $files = @("docker-compose.yml", "docker-compose.services.yml", "docker-compose.dev-profiles.yml",
            "docker-compose.full-stack-gateway.yml", "docker-compose.acceptance.yml", "docker-compose.acceptance-prodlike.yml")
          $composeArgs = $files | ForEach-Object { "-f", $_ }
          docker compose -p hrm-acceptance @composeArgs --profile full-stack up -d --no-deps --no-build --force-recreate --wait hr-core-web hr-contracts-web
          if ($LASTEXITCODE -ne 0) { throw "prod-like switch failed with exit code $LASTEXITCODE" }
          # The app services have no healthcheck, so --wait returns once the containers run; the first journey request got
          # 502 from the gateway (run 41147863512). Wait until the gateway reaches both new upstreams (its loopback-only
          # /health/upstreams/* routes, called from inside the gateway container).
          foreach ($upstream in @("hr-core", "hr-contracts")) {
            $ready = $false
            for ($i = 1; $i -le 60; $i++) {
              docker compose -p hrm-acceptance @composeArgs exec -T hr-gateway curl -fsS -o /dev/null "http://localhost:8080/health/upstreams/$upstream"
              if ($LASTEXITCODE -eq 0) { $ready = $true; Write-Host "gateway reaches $upstream after $i check(s)"; break }
              Start-Sleep -Seconds 3
            }
            if (-not $ready) { throw "gateway does not reach $upstream after the prod-like switch" }
          }

      - name: Run requisition-to-hire journey (prod-like)
        env:
          RUN_PLAYWRIGHT_E2E: "true"
          GATEWAY_BASE_URL: "http://localhost:6200"
          KEYCLOAK_BASE_URL: "http://localhost:6388"
          KEYCLOAK_HR_GATEWAY_CLIENT_SECRET: ci-gateway-secret-lab-only
          COMPOSE_PROJECT_NAME: hrm-acceptance
        run: >
          dotnet test src/Tests/HRManagement.E2E/HRManagement.E2E.csproj
          --configuration Release --no-build
          --filter "Category=JourneyProdLike"
          --logger "trx;LogFileName=recruitment-journey-prodlike-results.trx"
          --results-directory ./TestResults/recruitment-journey

      - name: Fail on skipped prod-like journey
        if: always()
        run: |
          trx=./TestResults/recruitment-journey/recruitment-journey-prodlike-results.trx
          if [ ! -f "$trx" ]; then echo "::error::No prod-like test results"; exit 1; fi
          skipped=$(grep -o 'outcome="NotExecuted"' "$trx" | wc -l || true)
          executed=$(grep -o 'outcome="Passed"' "$trx" | wc -l || true)
          echo "Passed: ${executed}, skipped: ${skipped}"
          if [ "${skipped}" -gt 0 ] || [ "${executed}" -lt 1 ]; then
            echo "::error::The prod-like recruitment journey did not run and pass."
            exit 1
          fi

      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruitment-journey-evidence
          path: |
            TestResults/recruitment-journey/**
            acceptance-evidence/AC-HCM-33/**
          if-no-files-found: warn

      - name: Tear down
        if: always()
        shell: pwsh
        run: ./scripts/acceptance-reset.ps1
