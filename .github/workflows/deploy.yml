name: deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deploy new release or rollback to a previous tag
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
      environment:
        description: Deployment target
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      run_migrations:
        description: Apply EF migrations before deploy (ignored for rollback)
        required: true
        default: true
        type: boolean
      rollback_tag:
        description: Image tag to rollback to (required when action=rollback)
        required: false
        type: string
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/hrmanagement

jobs:
  # ── Build & push (deploy path only) ─────────────────────────────────────────
  build-and-push:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: hr-gateway
            dockerfile: docker/DotnetService.Dockerfile
            image: hr-gateway
            project_csproj: src/Gateway/HRManagement.Gateway/HRManagement.Gateway.csproj
            assembly_name: HRManagement.Gateway.dll
            needs_krb5: "false"
            gateway_audit_dir: "true"
          - service: hr-core-web
            dockerfile: docker/DotnetService.Dockerfile
            image: hr-core-web
            project_csproj: src/Services/HRCore/HR.Core.Web/HR.Core.Web.csproj
            assembly_name: HR.Core.Web.dll
            needs_krb5: "true"
            gateway_audit_dir: "false"
          - service: hr-contracts-web
            dockerfile: docker/DotnetService.Dockerfile
            image: hr-contracts-web
            project_csproj: src/Services/HRContracts/HR.Contracts.Web/HR.Contracts.Web.csproj
            assembly_name: HR.Contracts.Web.dll
            needs_krb5: "true"
            gateway_audit_dir: "false"
          - service: hr-health-web
            dockerfile: docker/DotnetService.Dockerfile
            image: hr-health-web
            project_csproj: src/Services/HRHealth/HR.Health.Web/HR.Health.Web.csproj
            assembly_name: HR.Health.Web.dll
            needs_krb5: "true"
            gateway_audit_dir: "false"
          - service: hr-movements-web
            dockerfile: docker/DotnetService.Dockerfile
            image: hr-movements-web
            project_csproj: src/Services/HRMovements/HR.Movements.Web/HR.Movements.Web.csproj
            assembly_name: HR.Movements.Web.dll
            needs_krb5: "true"
            gateway_audit_dir: "false"
          - service: hr-training-web
            dockerfile: docker/DotnetService.Dockerfile
            image: hr-training-web
            project_csproj: src/Services/HRTraining/HR.Training.Web/HR.Training.Web.csproj
            assembly_name: HR.Training.Web.dll
            needs_krb5: "true"
            gateway_audit_dir: "false"
          - service: payroll-web
            dockerfile: docker/DotnetService.Dockerfile
            image: payroll-web
            project_csproj: src/Services/Payroll/Payroll.Web/Payroll.Web.csproj
            assembly_name: Payroll.Web.dll
            needs_krb5: "true"
            gateway_audit_dir: "false"
          - service: idcard-web
            dockerfile: docker/DotnetService.Dockerfile
            image: idcard-web
            project_csproj: src/Services/IDCard/IDCard.Web/IDCard.Web.csproj
            assembly_name: IDCard.Web.dll
            needs_krb5: "true"
            gateway_audit_dir: "false"
          - service: records-archive-web
            dockerfile: docker/DotnetService.Dockerfile
            image: records-archive-web
            project_csproj: src/Services/RecordsArchive/Records.Archive.Web/Records.Archive.Web.csproj
            assembly_name: Records.Archive.Web.dll
            needs_krb5: "true"
            gateway_audit_dir: "false"
          - service: admin-logistics-web
            dockerfile: docker/DotnetService.Dockerfile
            image: admin-logistics-web
            project_csproj: src/Services/AdminLogistics/Admin.Logistics.Web/Admin.Logistics.Web.csproj
            assembly_name: Admin.Logistics.Web.dll
            needs_krb5: "true"
            gateway_audit_dir: "false"
          - service: it-infra-web
            dockerfile: docker/DotnetService.Dockerfile
            image: it-infra-web
            project_csproj: src/Services/ITInfrastructure/IT.Infra.Web/IT.Infra.Web.csproj
            assembly_name: IT.Infra.Web.dll
            needs_krb5: "true"
            gateway_audit_dir: "false"
          - service: dev-analytics-web
            dockerfile: docker/DotnetService.Dockerfile
            image: dev-analytics-web
            project_csproj: src/Services/DevAnalytics/Dev.Analytics.Web/Dev.Analytics.Web.csproj
            assembly_name: Dev.Analytics.Web.dll
            needs_krb5: "true"
            gateway_audit_dir: "false"
          - service: compliance-web
            dockerfile: docker/DotnetService.Dockerfile
            image: compliance-web
            project_csproj: src/Services/Compliance/Compliance.Web/Compliance.Web.csproj
            assembly_name: Compliance.Web.dll
            needs_krb5: "true"
            gateway_audit_dir: "false"
          - service: auth-directory-web
            dockerfile: docker/DotnetService.Dockerfile
            image: auth-directory-web
            project_csproj: src/Services/AuthDirectory/Auth.Directory.Web/Auth.Directory.Web.csproj
            assembly_name: Auth.Directory.Web.dll
            needs_krb5: "true"
            gateway_audit_dir: "false"
          - service: file-storage-web
            dockerfile: docker/DotnetService.Dockerfile
            image: file-storage-web
            project_csproj: src/Services/FileStorage/File.Storage.Web/File.Storage.Web.csproj
            assembly_name: File.Storage.Web.dll
            needs_krb5: "true"
            gateway_audit_dir: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Generate Docker build manifest
        run: pwsh -NoProfile -File scripts/docker-generate-build-manifest.ps1

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            PROJECT_CSPROJ=${{ matrix.project_csproj }}
            ASSEMBLY_NAME=${{ matrix.assembly_name }}
            NEEDS_KRB5=${{ matrix.needs_krb5 }}
            GATEWAY_AUDIT_DIR=${{ matrix.gateway_audit_dir }}
          # DEP-001: never push :latest for releases — only immutable SHA tag
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.meta.outputs.tag }}

      - name: Record digest
        run: |
          mkdir -p digests
          echo "${{ matrix.image }}@${{ steps.build.outputs.digest }}" > "digests/${{ matrix.image }}.txt"
          echo "Pushed ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.meta.outputs.tag }} digest=${{ steps.build.outputs.digest }}"

      - name: Trivy image scan (SUP-001-C)
        # Pin commit (v0.36.0) — prefer SHA after 2026 trivy-action tag incidents
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table

      - name: Generate SBOM (SUP-001-D)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.meta.outputs.tag }}
          format: cyclonedx-json
          artifact-name: sbom-${{ matrix.image }}-${{ steps.meta.outputs.tag }}.cyclonedx.json
          output-file: sbom-${{ matrix.image }}.cyclonedx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.cyclonedx.json
          retention-days: 90

      - uses: sigstore/cosign-installer@v3.7.0

      - name: Cosign sign image (SUP-001-D)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign --yes \
            "${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}"

      - name: Attest build provenance (SUP-001-D light)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}
          path: digests/${{ matrix.image }}.txt
          retention-days: 90

  # ── Migrations (before deploy; locked; includes FileStorage) ────────────────
  migrate:
    needs: build-and-push
    # Run on workflow_dispatch when requested, OR automatically on tag push (v*)
    if: >-
      always()
      && needs.build-and-push.result == 'success'
      && (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy' && github.event.inputs.run_migrations == 'true')
        || github.event_name == 'push'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore local tools (dotnet-ef)
        run: dotnet tool restore

      - name: Restore (locked mode)
        run: dotnet restore HRManagement.slnx --locked-mode

      - name: Build EF migration bundles
        run: bash scripts/build-ef-bundles.sh

      - name: Upload EF bundles
        uses: actions/upload-artifact@v4
        with:
          name: efbundles
          path: artifacts/efbundles/
          retention-days: 30

      - name: Apply migrations
        env:
          ConnectionStrings__GatewayAuditDb: ${{ secrets.GATEWAY_AUDIT_DB }}
          ConnectionStrings__HRCoreDb: ${{ secrets.HR_CORE_DB }}
          ConnectionStrings__ContractsDb: ${{ secrets.HR_CONTRACTS_DB }}
          ConnectionStrings__PayrollDb: ${{ secrets.PAYROLL_DB }}
          ConnectionStrings__HealthDb: ${{ secrets.HR_HEALTH_DB }}
          ConnectionStrings__MovementsDb: ${{ secrets.HR_MOVEMENTS_DB }}
          ConnectionStrings__TrainingDb: ${{ secrets.HR_TRAINING_DB }}
          ConnectionStrings__IDCardDb: ${{ secrets.IDCARD_DB }}
          ConnectionStrings__ArchiveDb: ${{ secrets.ARCHIVE_DB }}
          ConnectionStrings__AdminDb: ${{ secrets.ADMIN_DB }}
          ConnectionStrings__ITInfraDb: ${{ secrets.IT_INFRA_DB }}
          ConnectionStrings__AnalyticsDb: ${{ secrets.ANALYTICS_DB }}
          ConnectionStrings__ComplianceDb: ${{ secrets.COMPLIANCE_DB }}
          ConnectionStrings__AuthDirectoryDb: ${{ secrets.AUTH_DIRECTORY_DB }}
          ConnectionStrings__FileStorageDb: ${{ secrets.FILE_STORAGE_DB }}
          MIGRATION_LOCK_CONNECTION: ${{ secrets.GATEWAY_AUDIT_DB }}
          EFBUNDLE_DIR: ${{ github.workspace }}/artifacts/efbundles
        run: bash scripts/run-migrations.sh

  # ── Deploy (new release) ────────────────────────────────────────────────────
  deploy:
    needs: [build-and-push, migrate]
    if: >-
      always()
      && needs.build-and-push.result == 'success'
      && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
      && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        # Matrix jobs do not reliably export outputs — derive tag from SHA directly
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3.7.0

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image signatures before deploy (SUP-001-D)
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/verify-image-signatures.sh

      # PLAN-36: one deploy path. The runner builds the deploy bundle (compose files, deploy/vps/*, the VpsDemo realm
      # with placeholders only) and the host runs deploy/vps/remote-deploy.sh, as scripts/vps/deploy.ps1 does from the
      # owner's machine. The host keeps its own /opt/hrm/shared/.env; nothing secret is copied.
      # Repository configuration: vars.APP_DOMAIN, secrets.DEPLOY_SSH_HOST/USER/KEY and secrets.DEPLOY_SSH_KNOWN_HOSTS
      # (the host's public key line; host keys are verified, never skipped).
      - name: Build deploy bundle
        shell: pwsh
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          ./scripts/prepare-keycloak-import.ps1 -Profile VpsDemo -AppDomain $env:APP_DOMAIN
          ./scripts/vps/make-deploy-bundle.ps1 -Tag "${{ steps.tag.outputs.tag }}"

      - name: Deploy via SSH (remote-deploy.sh)
        id: ssh-deploy
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH="ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes $SSH_USER@$SSH_HOST"
          HRM_IMAGE_REPO="ghcr.io/$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/hrmanagement"
          scp -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "artifacts/vps/hrm-deploy-$TAG.tar.gz" "$SSH_USER@$SSH_HOST:/opt/hrm/releases/"
          $SSH "set -e; cd /opt/hrm/releases; rm -rf $TAG hrm-deploy-$TAG; tar -xzf hrm-deploy-$TAG.tar.gz; mv hrm-deploy-$TAG $TAG; rm -f hrm-deploy-$TAG.tar.gz"
          $SSH "cd /opt/hrm/releases/$TAG && HRM_IMAGE_REPO=$HRM_IMAGE_REPO bash deploy/vps/remote-deploy.sh deploy $TAG"

      - name: Post-deploy health gate (smoke.sh)
        id: health-gate
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          # PLAN-35 defect 6: the old gate called /health/upstreams/* anonymously and passed on the login redirect.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "bash /opt/hrm/current/deploy/vps/smoke.sh" > smoke.json
          cat smoke.json

      - name: Rollback on health-gate failure
        if: failure() && steps.ssh-deploy.outcome == 'success' && steps.health-gate.outcome == 'failure'
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "bash /opt/hrm/current/deploy/vps/remote-deploy.sh rollback"

      - name: Post-deploy summary
        if: always()
        run: |
          echo "Action: deploy"
          echo "Image tag: ${{ steps.tag.outputs.tag }}"
          echo "SHA: ${{ github.sha }}"
          echo "Environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}"
          echo "SSH deploy: ${{ steps.ssh-deploy.outcome }}"
          echo "Health gate: ${{ steps.health-gate.outcome }}"

  # ── Manual rollback (workflow_dispatch action=rollback) ─────────────────────
  rollback:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate rollback_tag
        run: |
          if [ -z "${{ github.event.inputs.rollback_tag }}" ]; then
            echo "::error::rollback_tag is required when action=rollback"
            exit 1
          fi
          echo "Rolling back to tag=${{ github.event.inputs.rollback_tag }}"

      - uses: sigstore/cosign-installer@v3.7.0

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify rollback image signatures (SUP-001-D)
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ github.event.inputs.rollback_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/verify-image-signatures.sh

      - name: Rollback via SSH (remote-deploy.sh)
        id: ssh-rollback
        env:
          TAG: ${{ github.event.inputs.rollback_tag }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          HRM_IMAGE_REPO="ghcr.io/$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/hrmanagement"
          # The release directory of the tag is still on the host (remote-deploy.sh keeps every release).
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "cd /opt/hrm/releases/$TAG && HRM_IMAGE_REPO=$HRM_IMAGE_REPO bash deploy/vps/remote-deploy.sh deploy $TAG"

      - name: Post-rollback health gate (smoke.sh)
        id: health-gate
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "bash /opt/hrm/current/deploy/vps/smoke.sh"
