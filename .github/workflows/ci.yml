  e2e:
    name: E2E
    # Mandatory gate: no PR label opt-in. Playwright browsers must be installed before RUN_PLAYWRIGHT_E2E.
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # PLAN-35: the stack builds every service image (the CI job ran out of disk doing the same, run 41083926373).
      - name: Free runner disk space
        run: bash scripts/ci/free-runner-disk.sh

      - name: Prepare CI stack environment
        run: bash scripts/prepare-ci-compose-env.sh

      # PLAN-35 (P-1): volume ownership for file-storage-web and one cold-start retry, CI path only.
      - name: Start stack
        run: bash scripts/ci/compose-up-retry.sh -f docker-compose.yml -f docker-compose.services.yml --profile full-stack

      - name: Wait for gateway health
        run: |
          set -euo pipefail
          # PLAN-35: the browser tests follow the login redirect to Keycloak, so wait for its realm too.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5000/health/live >/dev/null \
              && curl -sf http://localhost:8088/realms/hrmanagement/.well-known/openid-configuration >/dev/null; then
              echo "Gateway and Keycloak realm ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Gateway /health/live or the Keycloak realm not ready"
          docker compose ps
          docker compose logs hr-gateway --tail 80 || true
          exit 1

      - name: Restore E2E project
        run: dotnet restore src/Tests/HRManagement.E2E/HRManagement.E2E.csproj --locked-mode

      - name: Build E2E project
        run: dotnet build src/Tests/HRManagement.E2E/HRManagement.E2E.csproj --configuration Release --no-restore

      - name: Install Playwright browsers
        run: pwsh src/Tests/HRManagement.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps

      # PLAN-35 (triage rule 3): cases in tests/e2e/quarantine.json are left out here and listed in the job summary.
      - name: E2E quarantine filter
        id: quarantine
        run: |
          filter=$(bash scripts/ci/e2e-quarantine-filter.sh)
          echo "filter=${filter}" >> "$GITHUB_OUTPUT"

      - name: Run E2E tests
        env:
          RUN_PLAYWRIGHT_E2E: "true"
          GATEWAY_BASE_URL: "http://localhost:5000"
          E2E_KEYCLOAK_USER: "hradmin"
          E2E_KEYCLOAK_PASSWORD: "HrAdmin123!"
          QUARANTINE_FILTER: ${{ steps.quarantine.outputs.filter }}
        run: >
          dotnet test src/Tests/HRManagement.E2E/HRManagement.E2E.csproj
          --configuration Release
          --filter "Category!=JourneyProdLike&FullyQualifiedName!~RecruitmentToHireJourney${QUARANTINE_FILTER}"
          --logger "trx;LogFileName=e2e-results.trx"
          --results-directory ./TestResults/e2e

      - name: Fail on skipped mandatory journeys
        if: always()
        run: |
          # Zero-skip policy for mandatory Playwright journeys when the gate is enabled.
          if [ -f ./TestResults/e2e/e2e-results.trx ]; then
            skipped=$(grep -o 'outcome="NotExecuted"' ./TestResults/e2e/e2e-results.trx | wc -l || true)
            echo "Skipped E2E cases: ${skipped}"
            if [ "${skipped}" -gt 0 ]; then
              echo "::error::Mandatory E2E journeys skipped (${skipped}). Fix or remove Skip attributes."
              exit 1
            fi
          fi

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: TestResults/e2e/**
          if-no-files-found: warn

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.services.yml --profile full-stack down -v

  # PLAN-35 (section 2): the acceptance job cannot pass before PLAN-41. It runs only when the repository variable
  # ENABLE_ACCEPTANCE_JOB is true (dated obligation CI-ACCEPTANCE-DISABLED in docs/qa/governance-exceptions.json);
  # acceptance-disabled prints that in the run summary. "Acceptance" is the future required-check name.
  acceptance-disabled:
    name: Acceptance disabled notice
    if: vars.ENABLE_ACCEPTANCE_JOB != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Acceptance job disabled until PLAN-41
        run: |
          echo "::notice::Acceptance job disabled until PLAN-41 (ENABLE_ACCEPTANCE_JOB is not true; obligation CI-ACCEPTANCE-DISABLED, review by 2026-12-14)"
          {
            echo "### Acceptance: معطّلة حتى PLAN-41"
            echo ""
            echo "The Acceptance job runs only when the repository variable ENABLE_ACCEPTANCE_JOB is true."
            echo "Dated obligation CI-ACCEPTANCE-DISABLED (docs/qa/governance-exceptions.json), owner PLAN-41, review by 2026-12-14."
          } >> "$GITHUB_STEP_SUMMARY"

  acceptance:
    name: Acceptance
    if: vars.ENABLE_ACCEPTANCE_JOB == 'true'
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Prepare CI stack environment
        run: bash scripts/prepare-ci-compose-env.sh

      - name: Start acceptance stack
        env:
          SEED_ACCEPTANCE: "true"
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.services.yml \
            -f docker-compose.local.yml \
            -f docker-compose.dev-profiles.yml \
            -f docker-compose.full-stack-gateway.yml \
            --profile full-stack up -d --wait --wait-timeout 600

      - name: Wait for gateway health
        run: pwsh -NoProfile -File scripts/verify-staging-stack.ps1

      - name: Apply PostgreSQL service roles (AC-20)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5433"
          POSTGRES_USER: hrm_ci
          POSTGRES_PASSWORD: hrm_ci_pwd
          POSTGRES_APP_PASSWORD: hrm_ci_app_pwd
        run: pwsh -NoProfile -File scripts/apply-postgres-service-roles.ps1 -UseDockerExec

      - name: Verify DB isolation (AC-20)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5433"
          POSTGRES_USER: hrm_ci
          POSTGRES_PASSWORD: hrm_ci_pwd
          POSTGRES_APP_PASSWORD: hrm_ci_app_pwd
        run: pwsh -NoProfile -File scripts/acceptance-verify-db-isolation.ps1

      - name: Build acceptance tests
        run: |
          dotnet restore src/Tests/HRManagement.AcceptanceTests/HRManagement.AcceptanceTests.csproj --locked-mode
          dotnet build src/Tests/HRManagement.AcceptanceTests/HRManagement.AcceptanceTests.csproj -c Release --no-restore

      - name: Run acceptance tests
        env:
          RUN_ACCEPTANCE: "true"
          # PLAN-33 (AC-HCM-33b): a skipped [RequiredAcceptance] scenario fails the job instead of passing silently.
          ACCEPTANCE_REQUIRE_ALL: "true"
          GATEWAY_BASE_URL: "http://localhost:5000"
          KEYCLOAK_BASE_URL: "http://localhost:8088"
          KEYCLOAK_HR_GATEWAY_CLIENT_SECRET: ci-gateway-secret-lab-only
          ACCEPTANCE_PERSONA_PASSWORD: "Accept-Hr123!"
        run: >
          dotnet test src/Tests/HRManagement.AcceptanceTests/HRManagement.AcceptanceTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=acceptance-results.trx"
          --results-directory ./TestResults/acceptance

      - name: AC-26 PII scan (Employees DB + logs)
        if: success()
        run: pwsh -NoProfile -File scripts/ac026-scan-pii.ps1

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: |
            acceptance-evidence/**
            TestResults/acceptance/**
          if-no-files-found: warn

      - name: Tear down acceptance stack
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.services.yml \
            -f docker-compose.local.yml \
            -f docker-compose.dev-profiles.yml \
            -f docker-compose.full-stack-gateway.yml \
            --profile full-stack down -v || true

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - name: Build for CodeQL
        run: |
          dotnet restore HRManagement.slnx --locked-mode
          dotnet build HRManagement.slnx --configuration Release --no-restore
      # PLAN-35 (D-QA-18): upload to code scanning only when CODE_SCANNING_UPLOAD is true (a private repository needs
      # GitHub Code Security); the gate below decides on the SARIF either way.
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
          upload: ${{ vars.CODE_SCANNING_UPLOAD == 'true' && 'always' || 'never' }}
          output: sarif-results
      - name: CodeQL SARIF gate (new error or security-severity >= 7.0 fails)
        run: pwsh -NoProfile -File scripts/ci/codeql-sarif-gate.ps1 -Sarif sarif-results -Baseline docs/qa/codeql-baseline.json -OutFile artifacts/codeql-gate.json
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: |
            sarif-results/**
            artifacts/codeql-gate.json
          if-no-files-found: warn

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # PLAN-35: the gitleaks image pinned by digest (docs/qa/tool-pins.json) over the whole history with .gitleaks.toml,
      # instead of gitleaks-action (unpinned gitleaks; with the old rule-less .gitleaks.toml it could not fail).
      - name: Gitleaks (whole history)
        run: bash scripts/ci/gitleaks.sh artifacts/gitleaks
      - name: Upload gitleaks report (redacted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: artifacts/gitleaks/
          if-no-files-found: warn
