  e2e:
    name: E2E
    # Mandatory gate: no PR label opt-in. Playwright browsers must be installed before RUN_PLAYWRIGHT_E2E.
    # PLAN-35: ubuntu-latest is Ubuntu 26.04, where Playwright 1.50.1 cannot install Chromium (run 41099010391).
    runs-on: ubuntu-24.04
    needs: [dedupe, reuse-check]
    if: ${{ !cancelled() && needs.dedupe.outputs.skip != 'true' }}
    env:
      REUSED_RUN: ${{ needs.reuse-check.outputs.reused-run }}
    steps:
      - uses: actions/checkout@v4

      - name: Name the reused run
        if: env.REUSED_RUN != ''
        run: bash scripts/ci/reused-note.sh

      - uses: actions/setup-dotnet@v4
        if: env.REUSED_RUN == ''
        with:
          global-json-file: global.json

      # Built before the stack starts: playwright.ps1 comes from this build, and the install runs while the stack starts.
      - name: Restore E2E project
        if: env.REUSED_RUN == ''
        run: dotnet restore src/Tests/HRManagement.E2E/HRManagement.E2E.csproj --locked-mode

      - name: Build E2E project
        if: env.REUSED_RUN == ''
        run: dotnet build src/Tests/HRManagement.E2E/HRManagement.E2E.csproj --configuration Release --no-restore

      - name: Playwright cache key
        id: playwright-key
        if: env.REUSED_RUN == ''
        run: bash scripts/ci/playwright-install.sh key

      # Restore and save are separate steps so that a red E2E run still leaves the cache: actions/cache saves only on success.
      - name: Restore Playwright cache
        id: playwright-cache
        if: env.REUSED_RUN == ''
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-debs
          key: ${{ steps.playwright-key.outputs.key }}

      # scripts/ci/playwright-install.sh says why: the apt mirror, not the browsers, took up to 52 minutes.
      - name: Start Playwright install
        if: env.REUSED_RUN == ''
        run: bash scripts/ci/playwright-install.sh start

      # PLAN-35: the stack builds every service image (the CI job ran out of disk doing the same, run 41083926373).
      - name: Free runner disk space
        if: env.REUSED_RUN == ''
        run: bash scripts/ci/free-runner-disk.sh

      - name: Prepare CI stack environment
        if: env.REUSED_RUN == ''
        run: bash scripts/prepare-ci-compose-env.sh

      # PLAN-35 (P-1): volume ownership for file-storage-web and one cold-start retry, CI path only.
      # docker-compose.ci-e2e.yml: the gateway's per-IP rate limit at 2000/min, because every E2E request comes from this
      # runner's IP (at the default 120 a queued request waited past the 30 s Playwright timeout).
      - name: Start stack
        if: env.REUSED_RUN == ''
        run: bash scripts/ci/compose-up-retry.sh -f docker-compose.yml -f docker-compose.services.yml -f docker-compose.ci-e2e.yml --profile full-stack

      - name: Wait for gateway health
        if: env.REUSED_RUN == ''
        run: |
          set -euo pipefail
          # PLAN-35: the browser tests follow the login redirect to Keycloak, so wait for its realm too.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5000/health/live >/dev/null \
              && curl -sf http://localhost:8088/realms/hrmanagement/.well-known/openid-configuration >/dev/null; then
              echo "Gateway and Keycloak realm ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Gateway /health/live or the Keycloak realm not ready"
          docker compose ps
          docker compose logs hr-gateway --tail 80 || true
          exit 1

      # Waits for the install begun in "Start Playwright install"; this step's log has its output and how long it took.
      - name: Install Playwright browsers
        if: env.REUSED_RUN == ''
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: bash scripts/ci/playwright-install.sh wait

      - name: Save Playwright cache
        if: env.REUSED_RUN == '' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-debs
          key: ${{ steps.playwright-key.outputs.key }}

      # PLAN-35 (triage rule 3): cases in tests/e2e/quarantine.json are left out here and listed in the job summary.
      - name: E2E quarantine filter
        id: quarantine
        if: env.REUSED_RUN == ''
        run: |
          filter=$(bash scripts/ci/e2e-quarantine-filter.sh)
          echo "filter=${filter}" >> "$GITHUB_OUTPUT"

      - name: Run E2E tests
        if: env.REUSED_RUN == ''
        env:
          RUN_PLAYWRIGHT_E2E: "true"
          GATEWAY_BASE_URL: "http://localhost:5000"
          E2E_KEYCLOAK_USER: "hradmin"
          E2E_KEYCLOAK_PASSWORD: "HrAdmin123!"
          # A failed browser test writes its Playwright trace and screenshot here (Upload Playwright traces). Absolute,
          # because the test host runs in the project's bin directory and a relative path would stay there.
          E2E_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/e2e-traces
          QUARANTINE_FILTER: ${{ steps.quarantine.outputs.filter }}
        run: >
          dotnet test src/Tests/HRManagement.E2E/HRManagement.E2E.csproj
          --configuration Release
          --filter "Category!=JourneyProdLike&FullyQualifiedName!~RecruitmentToHireJourney${QUARANTINE_FILTER}"
          --logger "trx;LogFileName=e2e-results.trx"
          --results-directory ./TestResults/e2e

      - name: Fail on skipped mandatory journeys
        if: always()
        run: |
          # Zero-skip policy for mandatory Playwright journeys when the gate is enabled.
          if [ -f ./TestResults/e2e/e2e-results.trx ]; then
            skipped=$(grep -o 'outcome="NotExecuted"' ./TestResults/e2e/e2e-results.trx | wc -l || true)
            echo "Skipped E2E cases: ${skipped}"
            if [ "${skipped}" -gt 0 ]; then
              echo "::error::Mandatory E2E journeys skipped (${skipped}). Fix or remove Skip attributes."
              exit 1
            fi
          fi

      - name: Upload E2E results
        if: always() && env.REUSED_RUN == ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: TestResults/e2e/**
          if-no-files-found: warn

      # A failed run keeps the service logs: the hosting log's "Request finished ... ms" includes the time a request
      # waited in the gateway's rate limiter queue, which the test output cannot show.
      - name: Collect stack logs
        if: failure()
        run: |
          mkdir -p artifacts/e2e-stack
          docker compose -f docker-compose.yml -f docker-compose.services.yml -f docker-compose.ci-e2e.yml --profile full-stack ps -a > artifacts/e2e-stack/ps.txt 2>&1 || true
          docker compose -f docker-compose.yml -f docker-compose.services.yml -f docker-compose.ci-e2e.yml --profile full-stack logs --no-color --timestamps > artifacts/e2e-stack/compose.log 2>&1 || true

      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-stack-logs
          path: artifacts/e2e-stack/
          retention-days: 7
          if-no-files-found: warn

      # PlaywrightFixture.RunTracedAsync: each failed browser test leaves <test>.zip (its trace, opened with
      # playwright.ps1 show-trace) and <test>.png (full-page screenshot) under artifacts/e2e-traces/<yyyyMMdd>/.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: artifacts/e2e-traces/
          retention-days: 7
          if-no-files-found: warn

      - name: Tear down stack
        if: always() && env.REUSED_RUN == ''
        run: docker compose -f docker-compose.yml -f docker-compose.services.yml -f docker-compose.ci-e2e.yml --profile full-stack down -v

  # PLAN-66: the images of the stage jobs, built once for the run. Service images carry this run's commit; third-party images are
  # pulled here, once, with retries, so the stage jobs pull from no registry. The archive lives for a day.
  acceptance-build:
    name: Acceptance images
    runs-on: ubuntu-24.04
    needs: [dedupe, reuse-check]
    if: ${{ !cancelled() && needs.dedupe.outputs.skip != 'true' }}
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      REUSED_RUN: ${{ needs.reuse-check.outputs.reused-run }}
    steps:
      - uses: actions/checkout@v4

      - name: Name the reused run
        if: env.REUSED_RUN != ''
        run: bash scripts/ci/reused-note.sh

      - name: Build the images and pull the others
        if: env.REUSED_RUN == ''
        env:
          COMPOSE_PARALLEL_LIMIT: "4"
          DOCKER_BUILDKIT: "1"
        run: pwsh -NoProfile -File scripts/ci/acceptance-images.ps1 -Action Build -SourceSha ${{ github.sha }}

      - name: Save the images
        if: env.REUSED_RUN == ''
        run: pwsh -NoProfile -File scripts/ci/acceptance-images.ps1 -Action Save

      - name: Upload the images
        if: env.REUSED_RUN == ''
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-images
          path: artifacts/acceptance/images/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # PLAN-41, PLAN-66: the stack the tests are written for, on the lab profile and on the prod-like profile, under
  # ACCEPTANCE_REQUIRE_ALL, one job per entry of stageJobs[] in tests/acceptance/ci-scope.json. Everything is in
  # scripts/ci/acceptance-job.ps1, the script the owner runs. Passwords are generated on each runner and never leave it, which is
  # why each stage scans its own results: the job that merges them cannot know those values. A stage job waits for no other job
  # to start: the meta stage reads the results of the CI job, and prodlike-final the folders of the other stages, each when they
  # are ready, with its stack already up.
  acceptance-stage:
    name: Acceptance stage (${{ matrix.name }})
    # PLAN-35: ubuntu-latest is Ubuntu 26.04, where Playwright 1.50.1 cannot install Chromium (run 41099010391).
    runs-on: ubuntu-24.04
    needs: [dedupe, reuse-check, acceptance-build]
    if: ${{ !cancelled() && needs.dedupe.outputs.skip != 'true' && needs.acceptance-build.result == 'success' }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lab-main
            stages: lab:main
            timeout: 35
          - name: lab-rest
            stages: lab:journey,lab:isolated
            timeout: 30
          - name: prodlike
            stages: prodLike:journey,prodLike:main,prodLike:isolated,prodLike:s2s42
            timeout: 35
          - name: prodlike-final
            stages: prodLike:final
            timeout: 40
          - name: prodlike-policy
            stages: prodLike:pol49
            timeout: 25
          - name: leastpriv
            stages: prodLike:leastpriv
            timeout: 20
          - name: meta
            stages: lab:meta
            timeout: 60
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REUSED_RUN: ${{ needs.reuse-check.outputs.reused-run }}
      # PLAN-66: a job that has no work in this run still succeeds and says why: the run reuses another (S2), or the governance
      # checks have no changed input (S3). An empty answer of the reuse check runs the stage.
      RUN_STAGE: ${{ needs.reuse-check.outputs.reused-run == '' && (matrix.name != 'meta' || needs.reuse-check.outputs.meta != 'skip') }}
    steps:
      # The whole history: AC-QA-35a runs the pre-push gitleaks and forbidden-file checks against origin/main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Name the reused run
        if: env.RUN_STAGE != 'true'
        run: bash scripts/ci/reused-note.sh

      - uses: actions/setup-dotnet@v4
        if: env.RUN_STAGE == 'true'
        with:
          global-json-file: global.json

      - name: Download the images
        if: env.RUN_STAGE == 'true'
        uses: actions/download-artifact@v4
        with:
          name: acceptance-images
          path: artifacts/acceptance/images

      - name: Load the images
        if: env.RUN_STAGE == 'true'
        run: |
          pwsh -NoProfile -File scripts/ci/acceptance-images.ps1 -Action Load
          rm -f artifacts/acceptance/images/images.tar.zst

      - name: Check that every image comes from this commit
        if: env.RUN_STAGE == 'true'
        run: pwsh -NoProfile -File scripts/ci/acceptance-images.ps1 -Action Verify -SourceSha ${{ github.sha }}

      - name: Run the stage
        if: env.RUN_STAGE == 'true'
        env:
          ACCEPTANCE_SIMULATE_MISSING: ${{ inputs.simulate_missing }}
          ACCEPTANCE_CLASSES: ${{ inputs.classes }}
          ACQA35_NEGATIVE_PR: "25"
          # The one green manual run of e2e-journeys (PLAN-35, run 41158446834) ran on this branch.
          ACQA35_JOURNEYS_BRANCH: release/plan-35-first-push
          COMPOSE_PARALLEL_LIMIT: "4"
          DOCKER_BUILDKIT: "1"
        run: pwsh -NoProfile -File scripts/ci/acceptance-job.ps1 -Profile Both -Stage "${{ matrix.stages }}" -StageName ${{ matrix.name }} -NoBuild -SourceSha ${{ github.sha }}

      # Nothing generated on the runner may reach the artifact: the upload below needs this step to pass.
      - name: Scan the stage results for secrets
        id: artifact-scan
        if: ${{ !cancelled() && env.RUN_STAGE == 'true' }}
        run: pwsh -NoProfile -File scripts/ci/acceptance-artifact-scan.ps1 -Target artifacts/acceptance/stages/${{ matrix.name }}

      - name: Upload the stage results
        if: ${{ !cancelled() && env.RUN_STAGE == 'true' && steps.artifact-scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-stage-${{ matrix.name }}
          path: artifacts/acceptance/stages/${{ matrix.name }}/
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Tear down the stacks
        if: always()
        run: |
          docker ps -aq | xargs -r docker rm -f > /dev/null || true
          docker volume prune -af > /dev/null || true

  # PLAN-66: the required check. It runs whatever the stage jobs did, and it is green only when every one of them succeeded and the
  # evidence they left, assembled in the layout of a sequential run, passes the summary, the validator and the guard. It must never
  # be skipped on a pull request: GitHub counts a skipped required check as passed.
  acceptance:
    name: Acceptance
    runs-on: ubuntu-24.04
    needs: [dedupe, reuse-check, acceptance-build, acceptance-stage]
    if: ${{ always() && needs.dedupe.outputs.skip != 'true' }}
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REUSED_RUN: ${{ needs.reuse-check.outputs.reused-run }}
      ACCEPTANCE_META_RULE: ${{ needs.reuse-check.outputs.meta }}
    steps:
      - uses: actions/checkout@v4

      # PLAN-66 (S2): the artifact of the reused run becomes this run's, with a reuse.json pointer, for the evidence of record.
      - name: Copy the evidence of the reused run
        if: ${{ !cancelled() && env.REUSED_RUN != '' }}
        run: pwsh -NoProfile -File scripts/ci/acceptance-reuse-evidence.ps1 -Run "$REUSED_RUN"

      - name: Assemble the evidence
        if: ${{ !cancelled() && env.REUSED_RUN == '' }}
        env:
          ACCEPTANCE_SIMULATE_MISSING: ${{ inputs.simulate_missing }}
          ACCEPTANCE_CLASSES: ${{ inputs.classes }}
        run: pwsh -NoProfile -File scripts/ci/acceptance-job.ps1 -Profile Both -MergeStages -SourceSha ${{ github.sha }}

      # Nothing generated on the runner may reach the artifact: the upload below needs this step to pass.
      - name: Scan the artifact for secrets
        id: artifact-scan
        if: ${{ !cancelled() }}
        run: pwsh -NoProfile -File scripts/ci/acceptance-artifact-scan.ps1

      - name: Upload acceptance evidence
        if: ${{ !cancelled() && steps.artifact-scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: artifacts/acceptance/run/
          if-no-files-found: error
          retention-days: 30
          # Rerunning one stage reruns this job in the same run.
          overwrite: true

      - name: Every stage job succeeded
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: pwsh -NoProfile -File scripts/ci/acceptance-needs-check.ps1

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    needs: [dedupe]
    if: ${{ !cancelled() && needs.dedupe.outputs.skip != 'true' }}
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - name: Build for CodeQL
        run: |
          dotnet restore HRManagement.slnx --locked-mode
          dotnet build HRManagement.slnx --configuration Release --no-restore
      # PLAN-35 (D-QA-18): upload to code scanning only when CODE_SCANNING_UPLOAD is true (a private repository needs
      # GitHub Code Security); the gate below decides on the SARIF either way.
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
          upload: ${{ vars.CODE_SCANNING_UPLOAD == 'true' && 'always' || 'never' }}
          output: sarif-results
      - name: CodeQL SARIF gate (new error or security-severity >= 7.0 fails)
        run: pwsh -NoProfile -File scripts/ci/codeql-sarif-gate.ps1 -Sarif sarif-results -Baseline docs/qa/codeql-baseline.json -OutFile artifacts/codeql-gate.json
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: |
            sarif-results/**
            artifacts/codeql-gate.json
          if-no-files-found: warn

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # PLAN-35: the gitleaks image pinned by digest (docs/qa/tool-pins.json) over the whole history with .gitleaks.toml,
      # instead of gitleaks-action (unpinned gitleaks; with the old rule-less .gitleaks.toml it could not fail).
      - name: Gitleaks (whole history)
        run: bash scripts/ci/gitleaks.sh artifacts/gitleaks
      - name: Upload gitleaks report (redacted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: artifacts/gitleaks/
          if-no-files-found: warn
