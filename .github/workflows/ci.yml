name: ci

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  # PLAN-66 (D-QA-66-1): every night on main, with the governance checks of the CI forced on.
  schedule:
    - cron: "0 2 * * *"
  # PLAN-41: the owner reruns acceptance by hand. With simulate_missing only the lab profile runs, on the class of that
  # scenario or on the listed classes (the negative proof of AC-QA-41a).
  workflow_dispatch:
    inputs:
      simulate_missing:
        description: "Class.Method of a required scenario to block (ACCEPTANCE_SIMULATE_MISSING); the job must turn red"
        required: false
        type: string
      classes:
        description: "Comma-separated class names; only these run"
        required: false
        type: string

# PLAN-66: a new push to a pull request cancels the run it replaces. Other runs have a group of their own and never cancel each other.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PLAN-37 (P-7): after a merge, the push run on main skips the heavy jobs only when the pull request already tested
  # this exact tree in a successful run (scripts/ci/dedupe-push-run.sh). It fails open: anything else runs everything.
  dedupe:
    name: Dedupe post-merge run
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether this push run repeats a tested pull request
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: ci.yml
          TREE_FILE: artifacts/ci/tested-tree.txt
        run: bash scripts/ci/dedupe-push-run.sh
      - name: Upload the tested tree (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tested-tree
          path: artifacts/ci/tested-tree.txt
          retention-days: 14

  # PLAN-66: what this run has to do. S2: a commit that leaves the code tree unchanged reuses the green full run of the pull request
  # (scripts/ci/acceptance-reuse.ps1). S3: the governance checks run when their inputs change (scripts/ci/acceptance-meta-rule.ps1).
  # Both fail towards work: an empty answer means everything runs. A job that failed outright also leaves Acceptance red, which
  # needs it: rerun it.
  reuse-check:
    name: Reuse check
    runs-on: ubuntu-latest
    needs: [dedupe]
    if: ${{ !cancelled() && needs.dedupe.outputs.skip != 'true' }}
    permissions:
      actions: read
      contents: read
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse }}
      reused-run: ${{ steps.reuse.outputs.reused-run }}
      meta: ${{ steps.meta.outputs.meta }}
    steps:
      # Two commits: a pull request run checks out the test merge commit, and its first parent is the base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Decide whether this run reuses a green full run
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
          ACCEPTANCE_SIMULATE_MISSING: ${{ inputs.simulate_missing }}
          ACCEPTANCE_CLASSES: ${{ inputs.classes }}
        run: pwsh -NoProfile -File scripts/ci/acceptance-reuse.ps1
      - name: Decide whether the governance checks run
        id: meta
        run: pwsh -NoProfile -File scripts/ci/acceptance-meta-rule.ps1
      - name: Upload the run identity
        uses: actions/upload-artifact@v4
        with:
          name: run-identity
          path: artifacts/ci/run-identity.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  build-and-test:
    name: CI
    runs-on: ubuntu-latest
    needs: [dedupe, reuse-check]
    if: ${{ !cancelled() && needs.dedupe.outputs.skip != 'true' }}
    # PLAN-66 (S2): run-steps.sh does none of the steps of a reusing run and names the reused run in the job summary.
    env:
      REUSED_RUN: ${{ needs.reuse-check.outputs.reused-run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        if: env.REUSED_RUN == ''
        with:
          global-json-file: global.json

      # QA-034: every build-and-test step comes from scripts/ci/steps.json (single source; same order locally via
      # scripts/ci-local.ps1). Add or change steps there; CiStepsParityTests rejects drift between the two files.
      - name: Free runner disk space
        run: bash scripts/ci/run-steps.sh --step "Free runner disk space"

      - name: PowerShell for Linux validation script tests
        run: bash scripts/ci/run-steps.sh --step "PowerShell for Linux validation script tests"

      - name: Restore local tools (dotnet-ef)
        run: bash scripts/ci/run-steps.sh --step "Restore local tools (dotnet-ef)"

      - name: Guard against wildcard package versions
        run: bash scripts/ci/run-steps.sh --step "Guard against wildcard package versions"

      - name: Base image pins (SUP-001-B)
        run: bash scripts/ci/run-steps.sh --step "Base image pins (SUP-001-B)"

      - name: Supply-chain exceptions validity (SUP-001-C)
        run: bash scripts/ci/run-steps.sh --step "Supply-chain exceptions validity (SUP-001-C)"

      - name: License policy (SUP-001-E)
        run: bash scripts/ci/run-steps.sh --step "License policy (SUP-001-E)"

      - name: No external CDN (UX-001-C)
        run: bash scripts/ci/run-steps.sh --step "No external CDN (UX-001-C)"

      - name: XSS DOM sinks gate (UX-001-E)
        run: bash scripts/ci/run-steps.sh --step "XSS DOM sinks gate (UX-001-E)"

      - name: Icon button accessible names (UX-002-E)
        run: bash scripts/ci/run-steps.sh --step "Icon button accessible names (UX-002-E)"

      - name: Non-prod data policy (GOV-001-D)
        run: bash scripts/ci/run-steps.sh --step "Non-prod data policy (GOV-001-D)"

      - name: No LEGAL_TBD in release path (GOV-002-B)
        run: bash scripts/ci/run-steps.sh --step "No LEGAL_TBD in release path (GOV-002-B)"

      - name: Committed acceptance evidence (PLAN-41)
        env:
          GH_TOKEN: ${{ github.token }}
          # PLAN-66 (S2): an evidence commit is what a reusing run is for, so this one step always runs.
          REUSED_RUN: ""
        run: bash scripts/ci/run-steps.sh --step "Committed acceptance evidence (PLAN-41)"

      - name: Dated obligations horizon (QA-034)
