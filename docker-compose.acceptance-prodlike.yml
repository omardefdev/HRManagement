# PLAN-33 (decision 2) / PLAN-25 (decision 10): production-like recruitment settings on the acceptance stack, for the
# RecruitmentToHireJourneyProdLikeE2ETests journey (Category=JourneyProdLike, in the CI journey filter since PLAN-25) and
# the AC-HCM-25 acceptance scenarios.
#
# PLAN-37: the service wiring (URLs, client ids, scopes) is NOT here and NOT in docker-compose.acceptance.yml: both
# acceptance stacks take it from the shared docker-compose.yml / docker-compose.services.yml, the same lines the production
# chain uses (deploy/wiring/service-wiring.json; ProductionWiringMatrixTests checks the parity). So this stack fails
# where production fails; it no longer inherits acceptance-only fixes.
#
# Start it with the whole stack (every service is created with this file):
#   powershell -NoProfile -ExecutionPolicy Bypass -File scripts/acceptance-up.ps1 -ProdLike [-SkipLiveVerification]
# which runs docker compose -p hrm-acceptance with docker-compose.yml, services, dev-profiles, full-stack-gateway,
# acceptance and this file, --profile full-stack up -d. Run acceptance-up.ps1 without -ProdLike to return to the lab
# profile.
#
# ASPNETCORE_ENVIRONMENT stays "Acceptance" so the acceptance personas, the Acceptance seed profile (no Demo seed), the
# local Keycloak, FileDrop OTP delivery and the caller-proof secret keep working. Because appsettings.Production.json is
# therefore NOT loaded, the Production VALUES that drive recruitment and the policy engine are mirrored here explicitly
# (the Production files of HR.Core, HR.Contracts, Admin.Logistics and IDCard):
#   - NationalScope:IsLabScale=false and HardEnforceCeilings=true;
#   - PolicyEngine (PLAN-49, D-POL-1 and D-POL-13): the five governed domains in Shadow, on HR.Core and on the service that
#     owns each (Assets.Custody on admin-logistics-web, IDCard.Lifecycle on idcard-web, Contracts.Leave on hr-contracts-web;
#     Core.Recruitment and Core.Establishment run inside HR.Core). Shadow records the engine's decision in the ledger and
#     changes no outcome. No domain is in Enforce here, and Pol049PolicyModeConsistencyTests keeps the owner's value equal
#     to HR.Core's over the merged chain. Assets.Custody is set on hr-core-web on purpose: docker-compose.acceptance.yml
#     (the lab file, part of this chain) sets it to Enforce for AC-10 and AC-11, and this file must win. The fifteen other
#     domains are out of the engine's scope: Off whatever is set, and a key for one of them stops the service at start-up.
#   - Recruitment:Approvals:AlwaysStartWorkflow=true, FailIfDefinitionMissing=true (PLAN-25 decision 10);
#   - Workflow:AdminBypass=false (PLAN-25 decision 4; also the default everywhere);
#   - Workflow:StepRole:ExemptEntityTypes (PLAN-43: the recorded exemptions; every other type is enforced);
#   - Recruitment:CommitteeApprovalDefault=true, Recruitment:Retention:Apply=false;
#   - HR.Contracts: Contracts:AllowDefaultContractTypeFallback=false.
# Since PLAN-25 (G-02 closed) the journey passes here; before PLAN-25 it stopped at the first approval.
services:
  hr-core-web:
    environment:
      # PLAN-39 (section 4): the Data Protection guard and the HR.Core key-ring canary are enforced on this stack too.
      DataProtection__RequirePersistentKeyRing: "true"
      NationalScope__IsLabScale: "false"
      NationalScope__HardEnforceCeilings: "true"
      PolicyEngine__Core.Recruitment: "Shadow"
      PolicyEngine__Core.Establishment: "Shadow"
      PolicyEngine__Assets.Custody: "Shadow"
      PolicyEngine__IDCard.Lifecycle: "Shadow"
      PolicyEngine__Contracts.Leave: "Shadow"
      Recruitment__Approvals__AlwaysStartWorkflow: "true"
      Recruitment__Approvals__FailIfDefinitionMissing: "true"
      Workflow__AdminBypass: "false"
      Recruitment__CommitteeApprovalDefault: "true"
      Recruitment__Retention__Apply: "false"

  hr-contracts-web:
    environment:
      # PLAN-39 (section 4): the Data Protection guard and the HR.Core key-ring canary are enforced on this stack too.
      DataProtection__RequirePersistentKeyRing: "true"
      Contracts__AllowDefaultContractTypeFallback: "false"
      # PLAN-49: as HR.Contracts' Production file. Every leave action asks HR.Core, which records its decision.
      PolicyEngine__Contracts.Leave: "Shadow"

  hr-gateway:
    environment:
      # PLAN-39 (section 4): the Data Protection guard and the HR.Core key-ring canary are enforced on this stack too.
      DataProtection__RequirePersistentKeyRing: "true"
    # PLAN-41: "up --wait" refuses a one-shot container that exits first unless a service waits for it. It finished before
    # the applications were ready on the least-privilege stack, and can on any slow host; production waits for it too.
    depends_on:
      keycloak-reconcile:
        condition: service_completed_successfully

  hr-movements-web:
    environment:
      # PLAN-39 (section 4): the Data Protection guard and the HR.Core key-ring canary are enforced on this stack too.
      DataProtection__RequirePersistentKeyRing: "true"

  payroll-web:
    environment:
      # PLAN-39 (section 4): the Data Protection guard and the HR.Core key-ring canary are enforced on this stack too.
      DataProtection__RequirePersistentKeyRing: "true"

  idcard-web:
    environment:
      # PLAN-39 (section 4): the Data Protection guard and the HR.Core key-ring canary are enforced on this stack too.
      DataProtection__RequirePersistentKeyRing: "true"
      # PLAN-46: a hire leaves a card draft for the card office to submit, and the owner-side sweep runs every minute.
      IdCard__Approval__AutoSubmitOnHire: "false"
      WorkflowApproval__Sweep__IntervalMinutes: "1"
      WorkflowApproval__Sweep__StaleAfterMinutes: "2"
      # PLAN-49: as IDCard's Production file. Processing a card asks HR.Core, which records its decision.
      PolicyEngine__IDCard.Lifecycle: "Shadow"

  records-archive-web:
    environment:
      # PLAN-39 (section 4): the Data Protection guard and the HR.Core key-ring canary are enforced on this stack too.
      DataProtection__RequirePersistentKeyRing: "true"

  admin-logistics-web:
    environment:
      # PLAN-39 (section 4): the Data Protection guard and the HR.Core key-ring canary are enforced on this stack too.
      DataProtection__RequirePersistentKeyRing: "true"
      # PLAN-49: as Admin.Logistics' Production file. Classify, create and assign ask HR.Core, which records its decision; the
      # outcome is still the local one (the static thresholds of the client's shim).
      PolicyEngine__Assets.Custody: "Shadow"

  it-infra-web:
    environment:
      # PLAN-39 (section 4): the Data Protection guard and the HR.Core key-ring canary are enforced on this stack too.
      DataProtection__RequirePersistentKeyRing: "true"

  compliance-web:
    environment:
      # PLAN-39 (section 4): the Data Protection guard and the HR.Core key-ring canary are enforced on this stack too.
      DataProtection__RequirePersistentKeyRing: "true"
      # PLAN-46: the owner-side sweep of disciplinary approvals runs every minute.
      WorkflowApproval__Sweep__IntervalMinutes: "1"
      WorkflowApproval__Sweep__StaleAfterMinutes: "2"

  auth-directory-web:
    environment:
      # PLAN-39 (section 4): the Data Protection guard and the HR.Core key-ring canary are enforced on this stack too.
      DataProtection__RequirePersistentKeyRing: "true"

  hr-health-web:
    environment:
      # PLAN-39 (section 4): the Data Protection guard and the HR.Core key-ring canary are enforced on this stack too.
      DataProtection__RequirePersistentKeyRing: "true"

  hr-training-web:
    environment:
      # PLAN-39 (section 4): the Data Protection guard and the HR.Core key-ring canary are enforced on this stack too.
      DataProtection__RequirePersistentKeyRing: "true"

  dev-analytics-web:
    environment:
      # PLAN-39 (section 4): the Data Protection guard and the HR.Core key-ring canary are enforced on this stack too.
      DataProtection__RequirePersistentKeyRing: "true"

  file-storage-web:
    environment:
      # PLAN-39 (section 4): the Data Protection guard and the HR.Core key-ring canary are enforced on this stack too.
      DataProtection__RequirePersistentKeyRing: "true"

  # PLAN-39 (P-2, P-4): the same reconcile as the production chain, on the realm rendered from the manifest with the
  # Acceptance profile (scripts/prepare-keycloak-import.ps1 -Profile Acceptance writes realm-hrmanagement.json and
  # reconcile-plan.tsv to docker/keycloak/import). Lab secrets: the generated service secret that
  # docker-compose.acceptance.yml gives every service, and the gateway secret of the local .env. AC-OPS-39d rotates
  # SVC_PAYROLL_CLIENT_SECRET with docker compose run -e ... keycloak-reconcile.
  keycloak-reconcile:
    image: quay.io/keycloak/keycloak:24.0
    entrypoint: ["bash", "/opt/hrm/reconcile/reconcile.sh"]
    restart: "no"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      HRM_KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_HR_GATEWAY_CLIENT_SECRET: ${KEYCLOAK_HR_GATEWAY_CLIENT_SECRET}
      KEYCLOAK_DIRECTORY_SYNC_SECRET: ${ACCEPTANCE_SVC_CLIENT_SECRET:?Acceptance service client secret is required}
      SVC_ADMIN_LOGISTICS_CLIENT_SECRET: ${ACCEPTANCE_SVC_CLIENT_SECRET:?Acceptance service client secret is required}
      SVC_AUTH_DIRECTORY_CLIENT_SECRET: ${ACCEPTANCE_SVC_CLIENT_SECRET:?Acceptance service client secret is required}
      SVC_COMPLIANCE_CLIENT_SECRET: ${ACCEPTANCE_SVC_CLIENT_SECRET:?Acceptance service client secret is required}
      SVC_DEV_ANALYTICS_CLIENT_SECRET: ${ACCEPTANCE_SVC_CLIENT_SECRET:?Acceptance service client secret is required}
      SVC_HR_CONTRACTS_CLIENT_SECRET: ${ACCEPTANCE_SVC_CLIENT_SECRET:?Acceptance service client secret is required}
      SVC_HR_CORE_CLIENT_SECRET: ${ACCEPTANCE_SVC_CLIENT_SECRET:?Acceptance service client secret is required}
      SVC_HR_HEALTH_CLIENT_SECRET: ${ACCEPTANCE_SVC_CLIENT_SECRET:?Acceptance service client secret is required}
      SVC_HR_MOVEMENTS_CLIENT_SECRET: ${ACCEPTANCE_SVC_CLIENT_SECRET:?Acceptance service client secret is required}
      SVC_HR_TRAINING_CLIENT_SECRET: ${ACCEPTANCE_SVC_CLIENT_SECRET:?Acceptance service client secret is required}
      SVC_IDCARD_CLIENT_SECRET: ${ACCEPTANCE_SVC_CLIENT_SECRET:?Acceptance service client secret is required}
      SVC_IT_INFRA_CLIENT_SECRET: ${ACCEPTANCE_SVC_CLIENT_SECRET:?Acceptance service client secret is required}
      SVC_PAYROLL_CLIENT_SECRET: ${ACCEPTANCE_SVC_CLIENT_SECRET:?Acceptance service client secret is required}
      SVC_RECORDS_ARCHIVE_CLIENT_SECRET: ${ACCEPTANCE_SVC_CLIENT_SECRET:?Acceptance service client secret is required}
    volumes:
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro
      - ./deploy/keycloak:/opt/hrm/reconcile:ro
    depends_on:
      keycloak:
        condition: service_started

  # PLAN-39 (section 3, P-4, AC-OPS-39e): Keycloak on its own database role on this stack too, made by the same SQL as
  # hrm-bootstrap step 3 (deploy/bootstrap/ensure-keycloak-role.sql). Lab password (ACCEPTANCE_KEYCLOAK_DB_PASSWORD, lab
  # default). keycloak_db must be empty or already Keycloak's: a keycloak_db the administrator filled before PLAN-39 stops
  # this one-shot ("run the ownership transfer"); on the lab stack drop and recreate keycloak_db (a new Keycloak volume).
  keycloak-db-role:
    image: postgres:16-alpine
    restart: "no"
    # The administrator password reaches psql through PGPASSWORD (an assignment: no quoting needed), never argv.
    entrypoint: ["sh", "-c", "PGPASSWORD=$$POSTGRES_PASSWORD psql -X -q -v ON_ERROR_STOP=1 -h postgresql -U $$POSTGRES_USER -d postgres -v transfer=false -f /opt/hrm-bootstrap/ensure-keycloak-role.sql"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      HRM_KEYCLOAK_PASSWORD: ${ACCEPTANCE_KEYCLOAK_DB_PASSWORD:-acceptance-keycloak-db-lab-only}
    volumes:
      - ./deploy/bootstrap:/opt/hrm-bootstrap:ro
    depends_on:
      postgresql:
        condition: service_healthy

  keycloak:
    environment:
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${ACCEPTANCE_KEYCLOAK_DB_PASSWORD:-acceptance-keycloak-db-lab-only}
    depends_on:
      keycloak-db-role:
        condition: service_completed_successfully
