# Production image overlay — GHCR image references for all app services.
# Replaces local `build:` with registry `image:` so hosts can deploy without source/build tools.
#
# Usage:
#   IMAGE_TAG=<sha12> GITHUB_REPOSITORY_OWNER=<owner> docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.services.yml \
#     -f docker-compose.observability.yml \
#     -f docker-compose.images.yml \
#     -f docker-compose.production.yml \
#     pull && ... up -d --remove-orphans
#
# IMAGE_TAG is required (short SHA from CI). Do not use :latest for releases.

services:
  hr-gateway:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:?GITHUB_REPOSITORY_OWNER required}/hrmanagement/hr-gateway:${IMAGE_TAG:?IMAGE_TAG required}
    build: !reset null

  hr-core-web:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:?GITHUB_REPOSITORY_OWNER required}/hrmanagement/hr-core-web:${IMAGE_TAG:?IMAGE_TAG required}
