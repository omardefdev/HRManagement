# Release image overlay: registry `image:` references instead of local `build:`, so a host deploys without source or
# build tools (PLAN-36, D-OPS-1). The registry is a variable, so GHCR, Docker Hub or a private registry work without
# code changes:
#   HRM_IMAGE_REPO   e.g. ghcr.io/<owner-lowercase>/hrmanagement, or localhost:5001/hrmanagement for the local registry
#   IMAGE_TAG        the 12-character commit SHA the images were built from; `latest` is refused by
#                    scripts/vps/build-push-images.ps1 and scripts/vps/lint-compose.ps1
#
# Usage:
#   HRM_IMAGE_REPO=... IMAGE_TAG=<sha12> docker compose -f docker-compose.yml -f docker-compose.services.yml \
#     -f docker-compose.images.yml -f docker-compose.production.yml --profile full-stack pull
# Single host: deploy/vps/remote-deploy.sh.

services:
  hr-gateway:
    image: ${HRM_IMAGE_REPO:?HRM_IMAGE_REPO required (e.g. ghcr.io/<owner>/hrmanagement)}/hr-gateway:${IMAGE_TAG:?IMAGE_TAG required}
    build: !reset null

  hr-core-web:
    image: ${HRM_IMAGE_REPO:?HRM_IMAGE_REPO required (e.g. ghcr.io/<owner>/hrmanagement)}/hr-core-web:${IMAGE_TAG:?IMAGE_TAG required}
    build: !reset null

