# Acceptance v2 override. Always run with COMPOSE_PROJECT_NAME=hrm-acceptance.
x-acceptance-service: &acceptance-service
  ASPNETCORE_ENVIRONMENT: Acceptance
  Seed__Profile: Acceptance
  DataProtection__KeyRingPath: /var/hrm/dpkeys
  Keycloak__AdditionalValidIssuers: http://localhost:6388/realms/hrmanagement
  GatewayCallerProof__Secret: ${ACCEPTANCE_GATEWAY_CALLER_PROOF_SECRET:?Acceptance caller-proof secret is required}

x-acceptance-dp-volumes: &acceptance-dp-volumes
  - acceptance_data_protection:/var/hrm/dpkeys

services:
  postgresql:
    container_name: !reset null
    ports: !override
      - "6433:5432"
    # pg_isready also succeeds against the temporary server used by the official
    # image during first-time initialization. Wait for postgres to become PID 1
    # so dependent services cannot start during the final initialization restart.
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = postgres && pg_isready -U \"$$POSTGRES_USER\" -d postgres"]

  rabbitmq:
    container_name: !reset null
    ports: !override
      - "6573:5672"
      - "15683:15672"

  minio:
    container_name: !reset null
    ports: !override
      - "6900:9000"
      - "6901:9001"

  clamav:
    container_name: !reset null
    ports: !override
      - "53310:3310"

  keycloak:
    container_name: !reset null
    ports: !override
      - "6388:8080"
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 6388
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"

  hr-core-web:
    container_name: !reset null
    ports: !override
      - "6210:8080"
    environment:
      <<: *acceptance-service
      HrGateway__PublicBaseUrl: http://localhost:6200
      # HCM-027 (E2): offer salary bounds from Payroll pay grades (S2S, scope payroll.grades.read).
      # Dev/acceptance only; without Integration__PayrollBaseUrl HR.Core treats Payroll as unavailable.
      Integration__PayrollBaseUrl: http://payroll-web:8080
      # Same lab-only value sync-keycloak-dev-realm.ps1 sets on every service client (not .env SVC_* values).
      ServiceIdentity__ClientSecret: dev-svc-secret-local-only
      # PLAN-30 (FS-030): file-storage.service-upload relays candidate documents to File.Storage (S2S).
      ServiceIdentity__Scope: file-storage.references payroll.grades.read file-storage.service-upload
      # PLAN-30 (HCM-030 E2): candidate documents go to File.Storage directly (caller proof signed), not via the gateway.
      Integration__FileStorageBaseUrl: http://file-storage-web:8080
      # PLAN-30 (COM-030): candidate messages go to FileDrop files that acceptance tests read on the host
      # (artifacts/acceptance/candidate-notifications/{sha256(idempotencyKey)}.json; format in docs/COM_001_NOTIFICATIONS.md).
      Notifications__Candidate__Provider: FileDrop
      Notifications__Candidate__FileDrop__Path: /var/hrm/candidate-notifications
      Recruitment__PublicPortalBaseUrl: http://localhost:6200
    volumes:
      - acceptance_data_protection:/var/hrm/dpkeys
      - ./artifacts/acceptance/candidate-notifications:/var/hrm/candidate-notifications

  hr-contracts-web:
    container_name: !reset null
    ports: !override
      - "6220:8080"
    environment:
      <<: *acceptance-service
      # PLAN-29: hire transactions need HR.Core code generation (SRV-/DEC- numbers) and the employee lookup (S2S).
      # Without these the CandidateAccepted consumer faulted in acceptance ("BaseAddress must be set").
      Integration__HrCoreBaseUrl: http://hr-core-web:8080
      ServiceIdentity__ClientId: svc-hr-contracts
      # Same lab-only value sync-keycloak-dev-realm.ps1 sets on every service client (not .env SVC_* values).
      ServiceIdentity__ClientSecret: dev-svc-secret-local-only
      ServiceIdentity__Scope: file-storage.references hr-core.lookup hr-core.workflow
    volumes: *acceptance-dp-volumes

  hr-health-web:
    container_name: !reset null
    ports: !override
      - "6230:8080"
    environment: *acceptance-service
    volumes: *acceptance-dp-volumes

  hr-movements-web:
    container_name: !reset null
    ports: !override
      - "6240:8080"
    environment: *acceptance-service
    volumes: *acceptance-dp-volumes

  hr-training-web:
    container_name: !reset null
    ports: !override
      - "6250:8080"
    environment: *acceptance-service
    volumes: *acceptance-dp-volumes

  payroll-web:
    container_name: !reset null
    ports: !override
      - "6260:8080"
    environment: *acceptance-service
    volumes: *acceptance-dp-volumes

  idcard-web:
    container_name: !reset null
    ports: !override
      - "6270:8080"
    environment: *acceptance-service
    volumes: *acceptance-dp-volumes

  records-archive-web:
    container_name: !reset null
    ports: !override
      - "6280:8080"
    environment: *acceptance-service
    volumes: *acceptance-dp-volumes

  admin-logistics-web:
    container_name: !reset null
    ports: !override
      - "6290:8080"
    environment: *acceptance-service
    volumes: *acceptance-dp-volumes

  it-infra-web:
    container_name: !reset null
    ports: !override
      - "6300:8080"
    environment: *acceptance-service
    volumes: *acceptance-dp-volumes

  dev-analytics-web:
    container_name: !reset null
    ports: !override
      - "6310:8080"
    environment: *acceptance-service
    volumes: *acceptance-dp-volumes

  compliance-web:
    container_name: !reset null
    ports: !override
      - "6320:8080"
    environment: *acceptance-service
    volumes: *acceptance-dp-volumes

  auth-directory-web:
    container_name: !reset null
    ports: !override
      - "6330:8080"
    environment: *acceptance-service
    volumes: *acceptance-dp-volumes

  file-storage-web:
    container_name: !reset null
    ports: !override
      - "6340:8080"
    environment: *acceptance-service
    volumes: *acceptance-dp-volumes

  hr-gateway:
    container_name: !reset null
    ports: !override
      - "6200:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Acceptance
      DataProtection__KeyRingPath: /var/hrm/dpkeys
      HrAuth__BehindGateway: "false"
      Keycloak__PublicAuthority: http://localhost:6388/realms/hrmanagement
      GatewayCallerProof__Secret: ${ACCEPTANCE_GATEWAY_CALLER_PROOF_SECRET:?Acceptance caller-proof secret is required}
      RateLimiting__PermitLimitPerMinute: "2000"
    volumes: *acceptance-dp-volumes

volumes:
  acceptance_data_protection:
