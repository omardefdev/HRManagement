x-leastpriv-env: &leastpriv-env
  Seed__Profile: None
  Database__RunMigrationsAtStartup: "false"
  Deployment__EnforceConfigGuard: "true"
  Deployment__DbPosture: least-privilege
  Deployment__MqPosture: least-privilege

x-wait-for-bootstrap: &wait-for-bootstrap
  hrm-bootstrap:
    condition: service_completed_successfully

services:
  postgresql:
    environment: *db-role-passwords

  hrm-bootstrap:
    image: hr-migrate:local
    restart: "no"
    user: "1654:1654"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      <<: [*db-role-passwords, *mq-user-passwords]
      PGHOST: postgresql
      PGPORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS required}
      HRM_RABBITMQ_API: http://rabbitmq:15672/api
    volumes:
      - leastpriv_bootstrap_results:/var/hrm/bootstrap
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  hr-gateway:
    environment:
      <<: *leastpriv-env
      ConnectionStrings__GatewayAuditDb: Host=postgresql;Port=5432;Database=gateway_audit_db;Username=gateway_audit_app;Password=${POSTGRES_GATEWAY_AUDIT_APP_PASSWORD:?POSTGRES_GATEWAY_AUDIT_APP_PASSWORD required};Maximum Pool Size=${HRM_PG_POOL_MAX:-10}
    depends_on: *wait-for-bootstrap

  hr-core-web:
    environment:
      <<: *leastpriv-env
      # The guard is enforced here: HR.Core needs its candidate-portal one-time-code key, as in production.
      Recruitment__Portal__OtpHmacKey: ${HR_CORE_OTP_HMAC_KEY:?HR_CORE_OTP_HMAC_KEY required}
      ConnectionStrings__HRCoreDb: Host=postgresql;Port=5432;Database=hr_core_db;Username=hr_core_app;Password=${POSTGRES_HR_CORE_APP_PASSWORD:?POSTGRES_HR_CORE_APP_PASSWORD required};Maximum Pool Size=${HRM_PG_POOL_MAX_HR_CORE:-20}
      RabbitMQ__Username: mq_hr_core
      RabbitMQ__Password: ${RABBITMQ_HR_CORE_PASS:?RABBITMQ_HR_CORE_PASS required}
    depends_on: *wait-for-bootstrap

  hr-contracts-web:
