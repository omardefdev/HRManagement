# PLAN-38 (section 6): the least-privilege acceptance stack, layered on the prod-like one (PLAN-37):
#   docker compose -p hrm-leastpriv --env-file .env.leastpriv -f docker-compose.yml -f docker-compose.services.yml \
#     -f docker-compose.dev-profiles.yml -f docker-compose.full-stack-gateway.yml -f docker-compose.acceptance.yml \
#     -f docker-compose.acceptance-prodlike.yml -f docker-compose.acceptance-leastpriv.yml --profile full-stack up -d --wait
# It runs as its own project (hrm-leastpriv) on new volumes and the acceptance ports, so stop hrm-acceptance first; it
# never touches the main acceptance database. .env.leastpriv (git-ignored) is the developer .env plus every role and
# broker password, filled by scripts/vps/init-secrets.ps1 (missing keys only, names printed).
# What it proves (AC-OPS-38a..h, AC-20):
#   - hrm-bootstrap (image hr-migrate:local) builds databases, roles, migrations (as <svc>_migrator) and the mq_* users
#     from empty volumes, and every application waits for it;
#   - every application connects as its *_app role and its mq_* user, and the production configuration guard is
#     enforced with both least-privilege postures (it refuses an administrator account);
#   - Seed:Profile=None: only the mandatory national and reference seeds run (acceptance seeds write rows for three
#     agencies, which enforced row level security may refuse: OPS-D, wave 2, so the main acceptance stack keeps the
#     administrator).

