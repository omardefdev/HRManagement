# BLD-002: set DOCKER_BUILDKIT=1 and COMPOSE_PARALLEL_LIMIT=2 (dev) or 4 (CI).
# Default `docker compose up` starts infrastructure only; use --profile full-stack for all services.
services:
  postgresql:
    image: postgres:16-alpine
    container_name: hrm-postgresql
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # IAM-004 / PLAN-38: development fallback for every *_app / *_migrator role (init-service-roles.sh); the production
      # chain passes one password per role (docker-compose.production.yml, D-38-3).
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}
    volumes:
      # PLAN-38: first initialisation runs the same idempotent SQL as the hrm-bootstrap init container.
      - ./deploy/bootstrap/ensure-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
      - ./docker/init-service-roles.sh:/docker-entrypoint-initdb.d/02-init-service-roles.sh
      - ./deploy/bootstrap:/opt/hrm-bootstrap:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  # PLAN-38 (§2): RabbitMQ 3.13 with the delayed-message plugin (docker/rabbitmq/Dockerfile, D-38-4), built locally
  # here; the image chain (docker-compose.images.yml) pulls hr-rabbitmq from the registry. A fixed host and node name
  # and a named volume keep durable messages and quorum queues across a recreate of the container.
  rabbitmq:
    build:
      context: ./docker/rabbitmq
    image: hr-rabbitmq:local
    container_name: hrm-rabbitmq
    hostname: rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_NODENAME: rabbit@rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # QA-034 (D-QA-7): the pinned minio/minio:RELEASE.2025-04-22T22-12-26Z can no longer be pulled. Dev and CI run
  # File.Storage on the Local provider; MinIO starts only with --profile object-storage (or the
  # docker-compose.object-storage.yml overlay) and an explicitly vetted, digest-pinned MINIO_IMAGE. Production MinIO
  # is PLAN-36/38.
  minio:
    profiles: ["object-storage"]
    # Compose interpolates every service, active or not, so the requirement is not ":?" here (it would break the
    # base stack); an empty image fails `config` as soon as the object-storage profile is enabled.
    image: ${MINIO_IMAGE:-}
    container_name: hrm-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      # SEC-004: dev-only defaults — production override uses :?required (no fallback).
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hrminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hrminio_secret_change_me}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4
    container_name: hrm-clamav
    # File uploads are scanned by this daemon. Without it the composite scanner recognises only
    # the EICAR test string and treats every other payload as clean.
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: hrm-keycloak
    # Import realm from ./docker/keycloak/import (run scripts/prepare-keycloak-import.ps1 first).
    command: ["start-dev", "--import-realm"]
    ports:
      - "8088:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: ${KC_DB}
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8088
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    volumes:
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped

  hr-core-web:
    profiles: ["full-stack"]
    build:
      context: .
      dockerfile: docker/DotnetService.Dockerfile
      args:
        PROJECT_CSPROJ: src/Services/HRCore/HR.Core.Web/HR.Core.Web.csproj
        ASSEMBLY_NAME: HR.Core.Web.dll
        NEEDS_KRB5: "true"
        GATEWAY_AUDIT_DIR: "false"
    container_name: hrm-hr-core-web
    ports:
      - "5010:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_PATHBASE: /ui/hr-core
      ConnectionStrings__HRCoreDb: Host=postgresql;Port=5432;Database=hr_core_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: ${RABBITMQ_DEFAULT_USER}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS}
      Keycloak__Authority: http://keycloak:8080/realms/hrmanagement
      Keycloak__AdditionalValidIssuers: http://localhost:8088/realms/hrmanagement
      HrAuth__BehindGateway: "true"
      # QA-034 (D-QA-7): Local by default; docker-compose.object-storage.yml switches to Minio.
      FileStorage__Provider: ${FILE_STORAGE_PROVIDER:-Local}
      FileStorage__LocalRootPath: /tmp/hrm-file-storage
      FileStorage__Endpoint: minio:9000
      # SEC-004: dev-only root defaults — production clears these (hr-core uses service identity, not direct MinIO).
      FileStorage__AccessKey: ${MINIO_ROOT_USER:-hrminio}
      FileStorage__SecretKey: ${MINIO_ROOT_PASSWORD:-hrminio_secret_change_me}
      FileStorage__UseSsl: "false"
      # COM-030: Development uses the FileDrop channel; /app is root-owned in the image, so write under /tmp.
      Notifications__Candidate__FileDrop__Path: /tmp/candidate-notifications
      # PLAN-37: service wiring from deploy/wiring/service-wiring.json, written once for every chain
      # (ProductionWiringMatrixTests); the production file adds only the mandatory secret.
      HrGateway__InternalBaseUrl: http://hr-gateway:8080
      Integration__PayrollBaseUrl: http://payroll-web:8080
      Integration__FileStorageBaseUrl: http://file-storage-web:8080
      ServiceIdentity__ClientId: svc-hr-core
      ServiceIdentity__ClientSecret: ${SVC_HR_CORE_CLIENT_SECRET:-dev-svc-secret-local-only}
      ServiceIdentity__Scope: file-storage.references payroll.grades.read file-storage.service-upload
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
    volumes:
      - hr_core_integration_outbox:/app/integration-outbox
    restart: unless-stopped

  hr-contracts-web:
    profiles: ["full-stack"]
    build:
      context: .
      dockerfile: docker/DotnetService.Dockerfile
      args:
        PROJECT_CSPROJ: src/Services/HRContracts/HR.Contracts.Web/HR.Contracts.Web.csproj
        ASSEMBLY_NAME: HR.Contracts.Web.dll
        NEEDS_KRB5: "true"
        GATEWAY_AUDIT_DIR: "false"
    container_name: hrm-hr-contracts-web
    ports:
      - "5020:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_PATHBASE: /ui/hr-contracts
      ConnectionStrings__ContractsDb: Host=postgresql;Port=5432;Database=hr_contracts_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: ${RABBITMQ_DEFAULT_USER}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS}
      Keycloak__Authority: http://keycloak:8080/realms/hrmanagement
      Keycloak__AdditionalValidIssuers: http://localhost:8088/realms/hrmanagement
      Keycloak__AdditionalValidAudiences: hr-gateway-client
      HrAuth__BehindGateway: "true"
      # PLAN-37: service wiring from deploy/wiring/service-wiring.json, written once for every chain
      # (ProductionWiringMatrixTests); the production file adds only the mandatory secret.
      Integration__HrCoreBaseUrl: http://hr-core-web:8080
      HrGateway__InternalBaseUrl: http://hr-gateway:8080
      ServiceIdentity__ClientId: svc-hr-contracts
      ServiceIdentity__ClientSecret: ${SVC_HR_CONTRACTS_CLIENT_SECRET:-dev-svc-secret-local-only}
      ServiceIdentity__Scope: hr-core.workflow hr-core.lookup file-storage.references
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped

  hr-gateway:
    profiles: ["full-stack"]
    build:
      context: .
      dockerfile: docker/DotnetService.Dockerfile
      args:
        PROJECT_CSPROJ: src/Gateway/HRManagement.Gateway/HRManagement.Gateway.csproj
        ASSEMBLY_NAME: HRManagement.Gateway.dll
        NEEDS_KRB5: "false"
        GATEWAY_AUDIT_DIR: "true"
    container_name: hrm-hr-gateway
    ports:
      - "${GATEWAY_HTTP_PORT:-5200}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__GatewayAuditDb: Host=postgresql;Port=5432;Database=gateway_audit_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Keycloak__Authority: http://keycloak:8080/realms/hrmanagement
      Keycloak__PublicAuthority: http://localhost:8088/realms/hrmanagement
      Keycloak__GetClaimsFromUserInfo: "false"
      Keycloak__ClientId: hr-gateway-client
      Keycloak__ClientSecret: ${KEYCLOAK_HR_GATEWAY_CLIENT_SECRET}
      Keycloak__RequireHttpsMetadata: "false"
      ReverseProxy__Clusters__hr-core-cluster__Destinations__destination1__Address: http://hr-core-web:8080
      ReverseProxy__Clusters__hr-contracts-cluster__Destinations__destination1__Address: http://hr-contracts-web:8080
      Gateway__HealthProbe__InternalBaseUrl: http://localhost:8080
      Gateway__EnabledModules__0: hr-core
      Gateway__EnabledModules__1: hr-contracts
      # PLAN-37: service wiring from deploy/wiring/service-wiring.json, written once for every chain
      # (ProductionWiringMatrixTests); the production file adds only the mandatory secret.
      Integration__HrCoreBaseUrl: http://hr-core-web:8080
      Integration__AuthDirectoryBaseUrl: http://auth-directory-web:8080
    depends_on:
      keycloak:
        condition: service_started
      hr-core-web:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  file_storage_data:
  clamav_data:
  hr_core_integration_outbox:
