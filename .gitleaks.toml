# SUP-001 / PLAN-35 - gitleaks config for this repository (CI job "Gitleaks", scripts/plan035-prepush.ps1).
title = "HRManagement gitleaks"

# PLAN-35: without [extend] this file defined zero rules, so every scan passed whatever it found (the old
# [allowlist] also skipped all of testdata/ and docs/completion-backlog/ by path alone). The default rule set is now
# active and no path is skipped wholesale.
[extend]
useDefault = true

# Every allowlist below matches a path AND the matched text (condition = "AND"), never a path alone.
# Add an entry only for a value that is deliberately fake or lab-only, with the reason in "description".

[[allowlists]]
description = "QA-003 Testcontainers Keycloak test realm: client secrets of the throwaway qa003 realm (qa003-service, and the deliberately wrong-audience client). Started only inside integration tests; never deployed."
condition = "AND"
paths = ['''^docker/keycloak/realm-qa003-test\.json$''']
regexTarget = "match"
regexes = ['''secret"\s*:\s*"qa003-(service|wrong)-secret"''']

[[allowlists]]
description = "QA-003 integration-test fixture mirroring the realm above (same throwaway qa003 secrets)."
condition = "AND"
paths = ['''^src/Tests/HRManagement\.IntegrationTests/TestFixtures\.cs$''']
regexTarget = "match"
regexes = ['''Secret\s*=>\s*"qa003-(service|wrong)-secret"''']

[[allowlists]]
description = "PLAN-36 local single-host acceptance (deploy/vps/.env.vps-local): lab-only values for the chain on the owner's Docker Desktop with hr.hrm.test/sso.hrm.test. Every value ends in -lab-only and is never used on a server (the server generates its own .env)."
condition = "AND"
paths = ['''^deploy/vps/\.env\.vps-local$''']
regexTarget = "line"
regexes = ['''^[A-Z][A-Z0-9_]*=[a-z0-9-]+-lab-only$''']

[[allowlists]]
description = "PLAN-37 progress checkpoint: the demo server's public ED25519 SSH host key fingerprint (SHA256:qWIf...), recorded to prove the host key was checked. A host key fingerprint is public by design (ssh prints it to anyone who connects); it is not a credential."
condition = "AND"
paths = ['''^reports/plan37-progress\.md$''']
regexTarget = "match"
regexes = ['''key SHA256:qWIfQls882KM/nQ99yV/WFU2Wk08t6DIb8o\+pUMGsto''']
